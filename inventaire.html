<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>

<style>
  :root{
    --bg:#FAF7F2;
    --ink:#1B2340;
    --ink-soft:#4A5170;
    --card:#FFFFFF;
    --orange:#FF6A3D;
    --orange-dark:#E14F22;
    --yellow:#FFC93C;
    --navy:#1B2A4A;
    --line:#EDE7DC;
    --red:#D64545;
    --green:#2FA36B;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  #inv-root{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:stretch;
  }
  .main-area{ flex:1; min-width:0; padding:24px 28px 60px 28px; }
  .mobile-menu-btn{
    display:none; position:fixed; top:14px; left:14px; z-index:60;
    background:var(--navy); color:#fff; border:none; border-radius:10px;
    width:40px; height:40px; font-size:18px; cursor:pointer; box-shadow:0 4px 14px rgba(27,35,64,0.3);
  }
  .sidebar-overlay{ display:none; }
  .sidebar{
    width:250px; flex-shrink:0; background:#fff; border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:20px 14px; position:sticky; top:0;
    height:100vh; overflow-y:auto; z-index:10;
  }
  .sidebar-brand{ display:flex; align-items:center; gap:10px; padding:4px 8px 22px 8px; }
  .inv-brand{ display:flex; align-items:center; gap:10px; }
  .inv-badge{ display:flex; align-items:center; justify-content:center; }
  .inv-badge img{ border-radius:6px; }
  .inv-footer{
    text-align:center; margin-top:40px; padding-top:16px;
    font-size:11px; color:var(--ink-soft); opacity:0.55;
  }
  .inv-title{
    font-family:'Poppins',sans-serif; font-weight:800; font-size:19px;
    color:var(--navy); margin:0; letter-spacing:-0.3px;
  }
  .inv-sub{ font-size:11px; color:var(--ink-soft); margin-top:1px; }

  .sidebar-footer{ margin-top:auto; padding-top:14px; border-top:1px solid var(--line); }
  .net-status{
    display:block; text-align:center; font-size:10.5px; padding:5px 10px; border-radius:8px;
    background:var(--bg); border:1px solid var(--line); margin-bottom:8px;
  }
  .net-status.offline{ color:var(--red); border-color:var(--red); font-weight:600; }
  .menu-wrap{ position:relative; }
  .profile-toggle{
    width:100%; background:var(--bg); border:1px solid var(--line); color:var(--ink);
    border-radius:10px; padding:8px 10px; cursor:pointer; font-size:12.5px; font-weight:600;
    display:flex; align-items:center; gap:8px; text-align:left;
  }
  .menu-toggle:hover, .profile-toggle:hover{ border-color:var(--orange); color:var(--orange-dark); }

  .quick-search-trigger{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--bg); border:1px solid var(--line); color:var(--ink-soft);
    border-radius:10px; padding:9px 12px; cursor:pointer; font-size:12.5px; font-weight:600;
    font-family:'Inter',sans-serif; margin-bottom:14px;
  }
  .quick-search-trigger:hover{ border-color:var(--orange); color:var(--orange-dark); }
  .kbd-hint{
    font-family:'IBM Plex Mono',monospace; font-size:10px; background:#fff; border:1px solid var(--line);
    border-radius:5px; padding:2px 6px; color:var(--ink-soft);
  }
  .qs-modal-bg{
    position:fixed; inset:0; background:#1B234099; z-index:80; display:flex; align-items:flex-start;
    justify-content:center; padding-top:12vh; animation: fadeIn .12s ease;
  }
  .qs-box{
    background:#fff; border-radius:16px; width:100%; max-width:520px; box-shadow:0 20px 60px rgba(27,35,64,0.3);
    overflow:hidden; animation: modalPop .15s cubic-bezier(.34,1.56,.64,1); max-height:70vh; display:flex; flex-direction:column;
  }
  .qs-input{
    width:100%; border:none; border-bottom:1px solid var(--line); padding:16px 18px; font-size:16px;
    font-family:'Inter',sans-serif; outline:none; box-sizing:border-box;
  }
  .qs-results{ overflow-y:auto; padding:8px; }
  .qs-result{
    display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; cursor:pointer;
  }
  .qs-result:hover, .qs-result.active{ background:var(--bg); }
  .qs-result-emoji{ font-size:18px; width:24px; text-align:center; flex-shrink:0; }
  .qs-result-info{ flex:1; min-width:0; }
  .qs-result-info b{ display:block; font-family:'Poppins',sans-serif; font-size:13.5px; color:var(--navy); }
  .qs-result-info small{ color:var(--ink-soft); font-size:11.5px; }
  .qs-empty{ padding:24px; text-align:center; color:var(--ink-soft); font-size:13px; }

  .cat-tabs{ display:flex; flex-direction:column; gap:3px; margin-bottom:0; }
  .cat-tab{
    font-family:'Poppins',sans-serif; font-weight:600; font-size:13.5px;
    padding:10px 14px; border-radius:10px; cursor:pointer; color:var(--ink-soft);
    background:transparent; border:1px solid transparent; text-align:left;
    transition:all .15s ease; display:flex; align-items:center; gap:10px;
  }
  .cat-tab.active{ background:var(--orange); color:#fff; box-shadow:0 4px 12px rgba(255,106,61,0.3); }

  .page-title-row{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
  .page-title{ font-family:'Poppins',sans-serif; font-weight:800; font-size:22px; color:var(--navy); margin:0; }
  .page-title-count{ font-size:12.5px; color:var(--ink-soft); background:#fff; border:1px solid var(--line); padding:5px 12px; border-radius:999px; }

  .view-tabs{ display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
  .view-tab{
    font-size:12.5px; font-weight:600; padding:8px 16px; cursor:pointer; color:var(--ink-soft);
    background:#fff; border:1px solid var(--line); border-radius:999px; transition:all .15s ease;
  }
  .view-tab.active{ color:#fff; background:var(--navy); border-color:var(--navy); }

  .panel{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; box-shadow:0 2px 10px rgba(27,35,64,0.04); }

  .stats-row{ display:flex; gap:14px; margin-bottom:18px; flex-wrap:wrap; }

  .dash-actions{ display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:14px; margin-bottom:28px; }
  .dash-action-card{
    background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px 16px;
    cursor:pointer; transition:all .18s ease; text-align:left;
  }
  .dash-action-card:hover{ border-color:var(--orange); transform:translateY(-2px); box-shadow:0 10px 24px rgba(27,35,64,0.08); }
  .dash-action-emoji{ font-size:26px; display:block; margin-bottom:8px; }
  .dash-action-card b{ display:block; font-family:'Poppins',sans-serif; font-size:14.5px; color:var(--navy); margin-bottom:2px; }
  .dash-action-card small{ color:var(--ink-soft); font-size:12px; }
  .dash-subtitle{ font-family:'Poppins',sans-serif; font-weight:700; font-size:15px; color:var(--navy); margin:0 0 12px 0; }

  .charts-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:14px; margin-bottom:8px; }
  .chart-card{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px 18px; }
  .chart-title{ font-family:'Poppins',sans-serif; font-weight:700; font-size:13px; color:var(--navy); margin-bottom:14px; }
  .bar-row{ display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:12px; }
  .bar-label{ width:38%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-soft); flex-shrink:0; }
  .bar-track{ flex:1; background:var(--bg); border-radius:6px; height:14px; overflow:hidden; }
  .bar-fill{ height:100%; background:linear-gradient(90deg, var(--orange), var(--yellow)); border-radius:6px; transition:width .5s ease; }
  .bar-value{ font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--navy); width:64px; text-align:right; flex-shrink:0; font-size:11.5px; }

  .trend-chart{ display:flex; align-items:flex-end; gap:8px; height:130px; padding-top:10px; }
  .trend-bar-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  .trend-bar{ width:100%; max-width:28px; background:linear-gradient(180deg, var(--yellow), var(--orange)); border-radius:5px 5px 0 0; transition:height .5s ease; }
  .trend-bar-label{ font-size:9.5px; color:var(--ink-soft); margin-top:5px; white-space:nowrap; }

  .activity-row{
    display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--line);
  }
  .activity-row:last-child{ border-bottom:none; }
  .activity-emoji{ font-size:20px; flex-shrink:0; }
  .activity-info{ flex:1; min-width:0; }
  .activity-info b{ display:block; font-family:'Poppins',sans-serif; font-size:13px; color:var(--navy); }
  .activity-info small{ color:var(--ink-soft); font-size:11.5px; }
  .activity-cost{ font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--orange-dark); flex-shrink:0; }
  .stat-card{
    background:var(--bg); border:1px solid var(--line); border-radius:12px;
    padding:12px 18px; min-width:140px;
  }
  .stat-card b{ display:block; font-family:'Poppins',sans-serif; font-size:20px; color:var(--navy); }
  .stat-card small{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-soft); }

  .toolbar{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; justify-content:space-between; align-items:center; }
  .btn-primary{
    background:var(--orange); color:#fff; border:none; border-radius:10px;
    padding:11px 18px; font-weight:700; font-size:13px; cursor:pointer;
    font-family:'Poppins',sans-serif;
    box-shadow:0 4px 12px rgba(255,106,61,0.3);
  }
  .btn-primary:hover{ background:var(--orange-dark); }
  .btn-secondary{
    background:transparent; border:1px solid var(--line); color:var(--ink-soft);
    border-radius:10px; padding:10px 16px; cursor:pointer; font-size:13px;
  }
  .btn-danger{ color:var(--red); border-color:var(--red); }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.5px;
    color:var(--ink-soft); padding:8px; border-bottom:2px solid var(--line);
  }
  td{ padding:11px 8px; border-bottom:1px solid var(--line); }
  tr:last-child td{ border-bottom:none; }
  .num{ font-family:'IBM Plex Mono',monospace; text-align:right; }
  .prix-detail{ font-size:11px; color:var(--ink-soft); }
  .count-input{
    width:80px; background:var(--bg); border:1px solid var(--line); color:var(--ink);
    border-radius:8px; padding:6px 8px; font-family:'IBM Plex Mono',monospace; text-align:right;
  }
  .sorti-neg{ color:var(--red); }

  .consume-btn{
    background:var(--bg); border:1px dashed var(--line); color:var(--ink-soft);
    border-radius:10px; padding:8px 14px; cursor:pointer; font-size:12.5px; font-weight:600;
    font-family:'Poppins',sans-serif; white-space:nowrap;
  }
  .consume-btn:hover{ border-color:var(--orange); color:var(--orange-dark); background:#fff; }
  .consume-btn.filled{
    background:linear-gradient(135deg, var(--orange), var(--yellow)); color:#fff; border:none;
    box-shadow:0 3px 10px rgba(255,106,61,0.3);
  }
  .consume-stepper{ display:flex; align-items:center; justify-content:center; gap:12px; margin:18px 0 8px 0; }
  .consume-input{
    width:110px; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:28px; font-weight:700;
    color:var(--navy); background:var(--bg); border:2px solid var(--line); border-radius:12px; padding:10px 6px;
  }
  .consume-stepper .tap-btn{ padding:14px 18px; }

  .icon-btn{
    background:var(--bg); border:1px solid var(--line); color:var(--ink-soft);
    border-radius:8px; width:28px; height:28px; cursor:pointer; font-size:12px; margin-left:4px;
  }
  .icon-btn:hover{ border-color:var(--orange); color:var(--orange); }

  .empty-state{ text-align:center; padding:44px 20px; color:var(--ink-soft); }
  .empty-state b{ display:block; color:var(--navy); font-size:15px; margin-bottom:6px; font-family:'Poppins',sans-serif; }

  .modal-bg{ position:fixed; inset:0; background:#1B234099; z-index:50; display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal{ background:#fff; border-radius:16px; padding:24px; width:100%; max-width:440px; box-shadow:0 20px 50px rgba(27,35,64,0.25); }
  .modal h2{ font-family:'Poppins',sans-serif; font-weight:700; font-size:17px; margin:0 0 16px 0; color:var(--navy); }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:11px; color:var(--ink-soft); margin-bottom:5px; font-weight:600; }
  .field input, .field select{ width:100%; background:var(--bg); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:9px 10px; font-size:13px; font-family:'Inter',sans-serif; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .field-hint{ font-size:11.5px; color:var(--orange-dark); font-weight:600; margin-top:5px; }
  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }
  .note{ font-size:12px; color:var(--ink-soft); line-height:1.5; }

  .histo-entry{ border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  .histo-entry-head{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-soft); margin-bottom:8px; flex-wrap:wrap; gap:6px; }
  .histo-entry-head b{ color:var(--navy); }
  .histo-total{ font-family:'Poppins',sans-serif; color:var(--orange-dark); font-weight:700; }

  .btn-secondary.btn-danger{ color:var(--red); border-color:var(--red); }
  .btn-secondary.btn-danger:hover{ background:var(--red); color:#fff; }

  .search-input{
    flex:1; min-width:180px; background:var(--bg); border:1px solid var(--line); color:var(--ink);
    border-radius:10px; padding:10px 14px; font-size:13.5px; font-family:'Inter',sans-serif;
  }
  .icon-btn-quick{
    width:auto; padding:0 10px; font-size:11px; font-weight:700; color:var(--orange-dark);
    border-color:var(--orange); background:#FFF4E9;
  }
  .icon-btn-quick:hover{ background:var(--orange); color:#fff; }

  .fut-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:12px; margin-bottom:20px; }
  .fut-card{
    background:var(--bg); border:1px solid var(--line); border-radius:16px; padding:12px 14px;
    display:flex; gap:10px; align-items:center; min-width:0;
  }
  .fut-card-info{ flex:1; min-width:0; }
  .fut-card-info b{ display:block; font-family:'Poppins',sans-serif; font-size:14px; color:var(--navy); margin-bottom:2px; }
  .fut-pct{ font-family:'IBM Plex Mono',monospace; font-size:22px; color:var(--orange-dark); font-weight:700; }
  .fut-card-info small{ display:block; color:var(--ink-soft); font-size:11px; margin-top:1px; }
  .fut-actions{ display:flex; gap:4px; margin-top:8px; flex-wrap:wrap; }

  .service-header{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;
    background:var(--navy); color:#fff; border-radius:14px; padding:14px 18px; margin-bottom:16px;
    font-size:13.5px;
  }
  .service-header .note{ color:#ffffffaa; }
  .service-card{ flex-direction:column; align-items:center; text-align:center; padding:16px 12px; }
  .service-card .fut-card-info{ width:100%; }
  .service-tap-row{ display:flex; gap:8px; margin-top:10px; justify-content:center; }
  .tap-btn{
    border:none; border-radius:12px; cursor:pointer; font-family:'Poppins',sans-serif; font-weight:700;
    transition: all .1s ease;
  }
  .tap-plus{
    background:linear-gradient(135deg, var(--orange), var(--yellow)); color:#fff; font-size:15px;
    padding:14px 22px; box-shadow:0 6px 16px rgba(255,106,61,0.4);
  }
  .tap-plus:active{ transform:scale(.94); box-shadow:0 2px 6px rgba(255,106,61,0.4); }
  .tap-minus{
    background:var(--bg); border:1px solid var(--line); color:var(--ink-soft); font-size:18px;
    padding:14px 16px;
  }
  .tap-minus:active{ transform:scale(.94); }

  .keg-gauge{ display:block; flex-shrink:0; }
  .keg-liquid{ transition: y .8s ease, height .8s ease; }
  .keg-wave{ animation: kegWaveBob 2.6s ease-in-out infinite; transform-origin:center; }
  @keyframes kegWaveBob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-2.5px); } }

  .menu-wrap{ position:relative; }
  .menu-toggle{
    background:var(--card); border:1px solid var(--line); color:var(--ink-soft);
    border-radius:10px; padding:8px 14px; cursor:pointer; font-size:12.5px; font-weight:600;
  }
  .menu-toggle:hover{ border-color:var(--orange); color:var(--orange-dark); }
  .profile-toggle{ display:flex; align-items:center; gap:7px; }
  .avatar-mini{
    width:24px; height:24px; border-radius:50%; overflow:hidden; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--orange), var(--yellow)); color:#fff; font-size:12px; flex-shrink:0;
  }
  .avatar-mini img{ width:100%; height:100%; object-fit:cover; }
  .avatar-big{
    width:76px; height:76px; border-radius:50%; overflow:hidden; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--orange), var(--yellow)); color:#fff; font-size:28px; margin:0 auto 14px auto;
    border:3px solid #fff; box-shadow:0 4px 14px rgba(27,35,64,0.15);
  }
  .avatar-big img{ width:100%; height:100%; object-fit:cover; }
  .avatar-upload-label{
    display:block; text-align:center; font-size:12px; color:var(--orange-dark); font-weight:600;
    cursor:pointer; margin:-8px 0 14px 0; text-decoration:underline;
  }
  .menu-dropdown{
    position:absolute; bottom:calc(100% + 8px); top:auto; left:0; right:auto; background:#fff; border:1px solid var(--line);
    border-radius:14px; padding:16px; width:230px; box-shadow:0 12px 30px rgba(27,35,64,0.15);
    z-index:40; animation: menuPop .15s ease;
  }
  .menu-dropdown hr{ border:none; border-top:1px solid var(--line); margin:12px 0; }
  .menu-dropdown .btn-secondary{ width:100%; margin-bottom:6px; text-align:left; }
  @keyframes menuPop{ from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }

  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes modalPop{ from{opacity:0; transform:scale(.95) translateY(8px);} to{opacity:1; transform:scale(1) translateY(0);} }
  .modal-bg{ animation: fadeIn .15s ease; }
  .modal{ animation: modalPop .18s cubic-bezier(.34,1.56,.64,1); }
  .btn-primary:active, .btn-secondary:active{ transform:scale(.96); }
  .btn-primary, .btn-secondary, .icon-btn, .cat-tab{ transition: all .15s ease; }
  tbody tr{ transition: background .12s ease; }
  tbody tr:hover{ background:var(--bg); }
  @keyframes panelFade{ from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:translateY(0);} }
  .panel{ animation: panelFade .18s ease; }

  body{ overflow-x:hidden; }
  #inv-root{ position:relative; }
  #inv-root::before{
    content:''; position:absolute; top:-120px; right:-120px; width:400px; height:400px;
    background:radial-gradient(circle, rgba(255,106,61,0.16), rgba(255,201,60,0.08) 60%, transparent 72%);
    border-radius:50%; pointer-events:none; z-index:0; animation: blobFloat 10s ease-in-out infinite;
  }
  #inv-root::after{
    content:''; position:absolute; top:200px; left:-160px; width:320px; height:320px;
    background:radial-gradient(circle, rgba(62,144,131,0.12), transparent 70%);
    border-radius:50%; pointer-events:none; z-index:0; animation: blobFloat 13s ease-in-out infinite reverse;
  }
  @keyframes blobFloat{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(-20px,25px) scale(1.08); } }
  .view-tabs, .panel, .inv-footer{ position:relative; z-index:1; }
  .sidebar{ position:sticky; z-index:20; }
  #inv-root::before, #inv-root::after{ z-index:0; }

  .btn-primary{ position:relative; overflow:hidden; }
  .btn-primary:hover{ background:var(--orange-dark); box-shadow:0 6px 20px rgba(255,106,61,0.45); transform:translateY(-1px); }
  .cat-tab:hover:not(.active){ border-color:var(--orange); color:var(--orange-dark); background:#fff; transform:translateY(-1px); }
  .view-tab:hover:not(.active){ color:var(--orange-dark); }
  .icon-btn:hover{ transform:translateY(-1px) scale(1.05); box-shadow:0 3px 10px rgba(27,35,64,0.12); }
  .stat-card{ transition: transform .18s ease, box-shadow .18s ease; }
  .stat-card:hover{ transform:translateY(-2px); box-shadow:0 8px 20px rgba(27,35,64,0.08); }

  .confetti-piece{
    position:fixed; top:-20px; width:9px; height:14px; z-index:200; pointer-events:none;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(100vh) rotate(540deg); opacity:0.3; }
  }

  .badge-alert{
    display:inline-block; font-size:10px; font-weight:700; text-transform:uppercase;
    background:var(--red); color:#fff; padding:2px 7px; border-radius:20px; margin-left:6px;
  }
  .net-status{ font-size:11px; padding:5px 10px; border-radius:8px; background:var(--bg); border:1px solid var(--line); }
  .net-status.offline{ color:var(--red); border-color:var(--red); font-weight:600; }

  /* ---- Assistant "Nouveau produit" (wizard) ---- */
  .wiz-modal{ max-width:480px; }
  .wiz-progress{ display:flex; gap:6px; margin-bottom:18px; }
  .wiz-dot{ flex:1; height:5px; border-radius:4px; background:var(--line); transition:background .2s ease; }
  .wiz-dot.done{ background:var(--orange); }
  .wiz-dot.current{ background:var(--yellow); }
  .wiz-step-title{ font-family:'Poppins',sans-serif; font-weight:800; font-size:19px; color:var(--navy); margin:0 0 4px 0; }
  .wiz-step-sub{ font-size:13px; color:var(--ink-soft); margin:0 0 18px 0; line-height:1.5; }
  .wiz-choices{ display:flex; flex-direction:column; gap:10px; margin-bottom:6px; }
  .wiz-choice{
    display:flex; align-items:center; gap:14px; text-align:left;
    background:var(--bg); border:2px solid var(--line); border-radius:14px;
    padding:14px 16px; cursor:pointer; transition:all .15s ease;
  }
  .wiz-choice:hover{ border-color:var(--orange); background:#FFF4E9; transform:translateY(-1px); }
  .wiz-choice .wiz-emoji{ font-size:26px; line-height:1; }
  .wiz-choice b{ display:block; font-family:'Poppins',sans-serif; font-size:14.5px; color:var(--navy); }
  .wiz-choice span{ font-size:12px; color:var(--ink-soft); }
  .wiz-quickpicks{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .wiz-quickpick{
    flex:1; min-width:64px; text-align:center; background:var(--bg); border:2px solid var(--line);
    border-radius:12px; padding:12px 6px; cursor:pointer; font-family:'Poppins',sans-serif; font-weight:700;
    color:var(--navy); font-size:14px; transition:all .15s ease;
  }
  .wiz-quickpick:hover{ border-color:var(--orange); }
  .wiz-quickpick.active{ border-color:var(--orange); background:var(--orange); color:#fff; }
  .wiz-computed{
    background:#FFF4E9; border:1px dashed var(--orange); border-radius:12px; padding:12px 14px;
    font-size:13px; color:var(--orange-dark); font-weight:600; margin-top:10px;
  }
  .wiz-recap{ background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:6px; }
  .wiz-recap-row{ display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .wiz-recap-row:last-child{ border-bottom:none; }
  .wiz-recap-row span:first-child{ color:var(--ink-soft); }
  .wiz-recap-row span:last-child{ font-weight:700; color:var(--navy); text-align:right; }
  .wiz-nav{ display:flex; justify-content:space-between; align-items:center; margin-top:18px; }
  .wiz-back{ background:none; border:none; color:var(--ink-soft); font-size:13px; cursor:pointer; font-weight:600; }
  .wiz-back:hover{ color:var(--orange); }

  @media print{
    body{ background:#fff; }
    .sidebar, .view-tabs, .no-print, .mobile-menu-btn{ display:none !important; }
    .main-area{ padding:0; }
    .panel{ box-shadow:none; border:none; padding:0; }
    .histo-entry{ break-inside:avoid; }
  }

  .inv-toast{
    position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-20px);
    background:var(--navy); color:#fff; padding:12px 20px; border-radius:10px;
    font-size:13px; font-weight:600; z-index:100; box-shadow:0 8px 24px rgba(27,35,64,0.3);
    opacity:0; transition:all .25s ease; max-width:90%; text-align:center;
  }
  .inv-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .inv-toast.inv-toast-error{ background:var(--red); }

  @media(max-width:900px){
    .mobile-menu-btn{ display:block; }
    .sidebar{
      position:fixed; left:0; top:0; height:100vh; width:250px;
      transform:translateX(-100%); transition:transform .2s ease; box-shadow:0 0 30px rgba(0,0,0,0.2);
    }
    .sidebar.open{ transform:translateX(0); }
    .sidebar-overlay.open{
      display:block; position:fixed; inset:0; background:#1B234066; z-index:15;
    }
    .main-area{ padding:70px 16px 50px 16px; }
  }

  @media(max-width:700px){
    table, thead, tbody, th, td, tr{ display:block; }
    thead{ display:none; }
    td{ display:flex; justify-content:space-between; border-bottom:none; padding:4px 8px; }
    td::before{ content:attr(data-label); color:var(--ink-soft); font-size:10.5px; text-transform:uppercase; }
    tr{ border-bottom:1px solid var(--line); padding:8px 0; }
  }
</style>

  window.handleProfilePhoto = function(evt){
    const file = evt.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        const size = 128;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const scale = Math.max(size/img.width, size/img.height);
        const w = img.width*scale, h = img.height*scale;
        ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
        document.getElementById('profile-avatar-preview').innerHTML = `<img src="${dataUrl}" />`;
        document.getElementById('profile-avatar-preview').dataset.photo = dataUrl;
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  async function migrateHistoriqueIfNeeded(parsed){
    if(parsed.historiqueMigrated) return;
    try{
      const allEntries = [];
      CATEGORIES.forEach(c => {
        const cd = parsed.data && parsed.data[c.id];
        if(cd && Array.isArray(cd.historique) && cd.historique.length > 0){
          cd.historique.forEach(entry => allEntries.push({...entry, catId:c.id}));
        }
      });
      for(let i=0; i<allEntries.length; i+=400){
        const chunk = allEntries.slice(i, i+400);
        const batch = db.batch();
        chunk.forEach(entry => batch.set(db.collection(HISTO_COLLECTION).doc(entry.id || uid()), entry));
        await batch.commit();
      }
      CATEGORIES.forEach(c => { if(state.data[c.id]) delete state.data[c.id].historique; });
      state.historiqueMigrated = true;
      await saveData();
      if(allEntries.length>0) showToast("Historique déplacé vers un stockage optimisé — le chargement va rester rapide même avec des années de données.");
    }catch(e){
      console.error('Erreur migration historique', e);
    }
  }

  async function migrateProduitsIfNeeded(parsed){

    try{
      const allProduits = [];
      CATEGORIES.forEach(c => {
        const cd = parsed.data && parsed.data[c.id];
        if(cd && Array.isArray(cd.produits) && cd.produits.length > 0){
          cd.produits.forEach(p => allProduits.push({...p, catId:c.id}));
        }
      });
      for(let i=0; i<allProduits.length; i+=400){
        const chunk = allProduits.slice(i, i+400);
        const batch = db.batch();
        chunk.forEach(p => batch.set(db.collection(PRODUITS_COLLECTION).doc(p.id || uid()), p));
        await batch.commit();
      }
      CATEGORIES.forEach(c => { if(state.data[c.id]) delete state.data[c.id].produits; });
      state.produitsMigrated = true;
      await saveData();
      if(allProduits.length>0) showToast("Produits déplacés vers un stockage sécurisé — chaque article se sauvegarde maintenant indépendamment, plus aucun risque d'écrasement.");
    }catch(e){
      console.error('Erreur migration produits', e);

  }

  function startListening(){
    stopListening();

      if(doc.exists){
        const parsed = doc.data();
        state.emailBackup = parsed.emailBackup || '';
        state.historiqueMigrated = !!parsed.historiqueMigrated;
        state.produitsMigrated = !!parsed.produitsMigrated;
        CATEGORIES.forEach(c => {
          if(parsed.data && parsed.data[c.id]){
            const incoming = parsed.data[c.id];
            if(incoming.serviceEnCours !== undefined) state.data[c.id].serviceEnCours = incoming.serviceEnCours;
          }
        });
        if(!parsed.historiqueMigrated){ migrateHistoriqueIfNeeded(parsed); }
        if(!parsed.produitsMigrated){ migrateProduitsIfNeeded(parsed); }
      }
      loaded = true;
      document.getElementById('backup-email').value = state.emailBackup;
      render();
    }, function(e){
      console.error(e);
      showToast("Erreur Firestore (" + (e.code||e.message) + "). Vérifie les règles Firestore (onglet Règles → doivent autoriser request.auth != null).", true);

  function startProduitsListening(){
    if(unsubscribeProduits) unsubscribeProduits();
    unsubscribeProduits = db.collection(PRODUITS_COLLECTION).onSnapshot(function(snap){
      const parCat = {};
      CATEGORIES.forEach(c => parCat[c.id] = []);
      snap.forEach(doc => {
        const p = doc.data();
        if(parCat[p.catId]) parCat[p.catId].push(p);

      CATEGORIES.forEach(c => { state.data[c.id].produits = parCat[c.id]; });
      render();

      showToast("Erreur Firestore sur les produits (" + (e.code||e.message) + ").", true);
    });
  }

  // ---- Accès à la collection historique (séparée du document principal) ----
  let historiqueError = {};
  let bilanError = false;
  let dashboardActivityError = false;

  async function loadHistoriquePage(catId, reset){
    if(historiqueLoading[catId]) return;
    historiqueLoading[catId] = true;
    historiqueError[catId] = false;
    if(reset){ historiqueCache[catId] = []; historiqueLastDoc[catId] = null; historiqueHasMore[catId] = true; }
    try{
      let q = db.collection(HISTO_COLLECTION).where('catId','==',catId).orderBy('date','desc').limit(20);
      if(historiqueLastDoc[catId]) q = q.startAfter(historiqueLastDoc[catId]);
      const snap = await q.get();
      const entries = [];
      snap.forEach(doc => entries.push(doc.data()));
      historiqueCache[catId] = (historiqueCache[catId]||[]).concat(entries);
      historiqueLastDoc[catId] = snap.docs.length>0 ? snap.docs[snap.docs.length-1] : historiqueLastDoc[catId];
      historiqueHasMore[catId] = snap.docs.length === 20;
    }catch(e){
      console.error('Détail :', e.message);
      historiqueError[catId] = true;
      delete historiqueCache[catId];
    }
    historiqueLoading[catId] = false;
    render();

    const today = new Date(parisTodayStr()+'T00:00:00');

  function animateStatCards(container){
    const els = (container||document).querySelectorAll('.stat-card b');
    els.forEach(el => {
      const raw = el.textContent.trim();
      if(!/^\d+$/.test(raw)) return; // n'anime que les nombres entiers simples
      const target = parseInt(raw,10);
      if(target === 0){ return; }
      let current = 0;
      const steps = Math.min(target, 24);
      const increment = target/steps;
      const duration = 500;
      const stepTime = Math.max(12, duration/steps);
      el.textContent = '0';
      const timer = setInterval(()=>{
        current += increment;
        if(current >= target){ el.textContent = target; clearInterval(timer); }
        else { el.textContent = Math.floor(current); }
      }, stepTime);
    });
  }

  function checkDlcAlerts(){
    if(dlcAlertShown) return;
    dlcAlertShown = true;
    const cd = state.data['nourriture'];
    if(!cd) return;
    let expiredCount = 0, urgentCount = 0;
    cd.produits.forEach(p => (p.dlcLots||[]).forEach(l => {
      const j = joursRestantsDLC(l.date);
      if(j < 0) expiredCount++;
      else if(j <= 10) urgentCount++;
    }));
    if(expiredCount > 0 || urgentCount > 0){
      let msg = '⏰ ';
      if(expiredCount>0) msg += `${expiredCount} lot(s) déjà périmé(s). `;
      if(urgentCount>0) msg += `${urgentCount} lot(s) à DLC dans moins de 10 jours.`;
      showToast(msg, true);
    }
  }

  function futInfo(p){
    if(!(p.volumeL > 0 && p.portionCl > 0 && p.unitesParLot > 0)) return null;
    const servingsPerKeg = p.unitesParLot;
    const fullKegs = Math.floor(p.stock / servingsPerKeg);
    const remainder = Math.round((p.stock - fullKegs*servingsPerKeg)*10)/10;
    let kegsReserve, pct, versesActuel;
    if(remainder > 0){
      kegsReserve = fullKegs;
      versesActuel = remainder;
      pct = Math.round((remainder/servingsPerKeg)*100);
    } else if(fullKegs > 0){
      kegsReserve = fullKegs - 1;
      versesActuel = servingsPerKeg;
      pct = 100;
    } else {
      kegsReserve = 0; versesActuel = 0; pct = 0;
    }
    return { servingsPerKeg, kegsReserve, pct, versesActuel };
  }

  function kegGaugeSVG(pct, idSuffix){
    const clamped = Math.max(0, Math.min(100, pct));
    const bodyTop = 20, bodyBottom = 130, bodyH = bodyBottom - bodyTop;
    const liquidH = bodyH * (clamped/100);
    const liquidY = bodyBottom - liquidH;
    const kegPath = "M22,20 Q22,8 50,8 Q78,8 78,20 L78,124 Q78,136 50,136 Q22,136 22,124 Z";
    return `
      <svg viewBox="0 0 100 144" width="46" height="66" class="keg-gauge">
        <defs>
          <clipPath id="kegClip-${idSuffix}"><path d="${kegPath}"/></clipPath>
          <linearGradient id="kegLiquid-${idSuffix}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFC93C"/>
            <stop offset="100%" stop-color="#E8A33D"/>
          </linearGradient>
        </defs>
        <path d="${kegPath}" fill="var(--bg)"/>
        <g clip-path="url(#kegClip-${idSuffix})">
          <rect x="15" y="${liquidY}" width="70" height="${liquidH+10}" fill="url(#kegLiquid-${idSuffix})" class="keg-liquid"/>
          ${liquidH>1 ? `<rect x="15" y="${liquidY-1.5}" width="70" height="3" fill="#fff" opacity="0.4" class="keg-wave"/>` : ''}
        </g>
        <path d="${kegPath}" fill="none" stroke="var(--navy)" stroke-width="3"/>
        <rect x="22" y="46" width="56" height="5" rx="1" fill="var(--navy)" opacity="0.45"/>
        <rect x="22" y="98" width="56" height="5" rx="1" fill="var(--navy)" opacity="0.45"/>
      </svg>`;
  }

      html += `</div>`;
    }

    if(catData().produits.length===0){
      html += `<div class="empty-state"><b>Aucun produit enregistré</b>Ajoute les produits que tu achètes et stockes pour cette catégorie.</div>`;
    } else if(produits.length===0){
      html += `<div class="empty-state"><b>Aucun résultat</b>Aucun produit ne correspond à "${escapeHtml(stockSearch)}".</div>`;
    } else if(autres.length > 0){
      html += `<table><thead><tr>
        <th>Produit</th><th style="text-align:right">Prix</th><th style="text-align:right">Stock</th><th style="text-align:right">Valeur</th><th></th>
      </tr></thead><tbody>`;
      autres.forEach(p => {
        const bas = p.seuilAlerte > 0 && p.stock <= p.seuilAlerte;

        html += `<tr>

          <td data-label="Valeur" class="num">${money(p.stock*p.prixAchat)}</td>
          <td style="text-align:right; white-space:nowrap;">
            ${peutRacheterVite ? `<button class="icon-btn icon-btn-quick" title="Racheter le même lot qu'avant : ${p.conditionnement}, ${money(p.prixLot)}" onclick="quickRestock('${p.id}')">⚡ +${p.unitesParLot}</button>` : ''}

            <div class="field"><label>Taille d'une portion servie (cl)</label><input type="number" step="0.01" min="0" id="wiz-portion-cl" value="${wiz.portionCl}" oninput="wizUpdateVolume()" placeholder="Ex. 25" /></div>
          </div>
          <div class="wiz-computed" id="wiz-volume-hint">${nb>0 ? `= environ <b>${nb} verres</b> de ${wiz.portionCl} cl par fût` : 'Renseigne la contenance et la portion pour voir le calcul.'}</div>`;
      }
      // type === 'lot' ou 'carton'
      const presets = [6,12,24];
      return `
        <h2 class="wiz-step-title">📦 Combien d'unités dans le ${isFood?'carton':'lot'} ?</h2>
        <p class="wiz-step-sub">Choisis une taille courante ou indique un nombre personnalisé.</p>
        <div class="wiz-quickpicks">
          ${presets.map(n=>`<div class="wiz-quickpick ${Number(wiz.unitesParLot)===n?'active':''}" onclick="wizPickLotSize(${n})">${n}</div>`).join('')}
          <div class="wiz-quickpick ${!presets.includes(Number(wiz.unitesParLot))?'active':''}" onclick="document.getElementById('wiz-unites-custom').focus()">Autre</div>
        </div>
        <div class="field"><label>Nombre exact d'unités dans ce ${isFood?'carton':'lot'}</label><input type="number" min="1" id="wiz-unites-custom" value="${wiz.unitesParLot}" oninput="wizSetCustomLotSize(this.value)" /></div>`;
    }
    if(step==='unite'){
      const suggestion = wiz.type==='fut' ? 'verre' : (isFood ? 'paquet' : catInfo().unite);
      if(!wiz.unite) wiz.unite = suggestion;
      return `
        <h2 class="wiz-step-title">Comment veux-tu le compter à l'inventaire ?</h2>
        <p class="wiz-step-sub">${wiz.type==='fut' ? "C'est ce que tu compteras réellement le jour J (ex. verres restants), pas le fût entier." : "Le mot utilisé pour l'unité de comptage (ex. paquet, boîte, unité)."}</p>
        <div class="field"><input type="text" id="wiz-unite" value="${escapeHtml(wiz.unite)}" placeholder="Ex. ${suggestion}" onkeydown="if(event.key==='Enter') wizNext()" /></div>`;
    }
    if(step==='prix'){
      const unite = wiz.unite || 'unité';
      let label = '';
      if(wiz.type==='unite' || wiz.type==='piece') label = `Prix payé pour ${wiz.type==='piece'?'un':'une'} ${unite}`;
      else if(wiz.type==='lot' || wiz.type==='carton') label = `Prix payé pour ce ${isFood?'carton':'lot'} entier (${wiz.unitesParLot} ${unite}s)`;
      else label = `Prix payé pour ce fût entier (${wiz.volumeL||0} L)`;
      const pu = wizPrixAchat();
      return `
        <h2 class="wiz-step-title">💶 Le prix</h2>
        <div class="field"><label>${label}</label><input type="number" step="0.01" min="0" id="wiz-prix" value="${wiz.prixLot}" oninput="wizUpdatePrix()" placeholder="Ex. 45.00" /></div>
        <div class="wiz-computed" id="wiz-prix-hint">${pu>0 ? `= <b>${money(pu)}</b> par ${unite}` : "Renseigne le prix payé pour voir le prix à l'unité."}</div>`;
    }
    if(step==='stock'){
      if(wiz.type === 'fut'){
        const nbFutsActuel = wiz.unitesParLot>0 ? Math.round((wiz.stock/wiz.unitesParLot)*10)/10 : 0;
        return `
          <h2 class="wiz-step-title">📊 Stock de départ</h2>
          <p class="wiz-step-sub">Combien de fûts complets (non entamés) as-tu déjà en stock ?</p>
          <div class="field-row">
            <div class="field"><label>Nombre de fûts complets</label><input type="number" step="1" min="0" id="wiz-stock-futs" value="${nbFutsActuel}" oninput="wizUpdateStockFuts()" /></div>
            <div class="field"><label>Seuil d'alerte (optionnel, en ${escapeHtml(wiz.unite)}s)</label><input type="number" step="0.01" min="0" id="wiz-seuil" value="${wiz.seuilAlerte}" /></div>
          </div>
          <div class="wiz-computed" id="wiz-stock-futs-hint">${wiz.unitesParLot>0 ? `= ${Math.round(nbFutsActuel*wiz.unitesParLot*10)/10} ${wiz.unite}(s) au total` : ''}</div>`;
      }
      return `
        <h2 class="wiz-step-title">📊 Stock de départ</h2>
        <p class="wiz-step-sub">Combien en as-tu déjà en stock, en ${wiz.unite}(s) ?</p>
        <div class="field-row">
          <div class="field"><label>Stock actuel (en ${escapeHtml(wiz.unite)}s)</label><input type="number" step="0.01" min="0" id="wiz-stock" value="${wiz.stock}" /></div>
          <div class="field"><label>Seuil d'alerte (optionnel)</label><input type="number" step="0.01" min="0" id="wiz-seuil" value="${wiz.seuilAlerte}" /></div>
        </div>`;
    }
    if(step==='dlc'){
      return `
        <h2 class="wiz-step-title">⏰ Date de péremption</h2>
        <p class="wiz-step-sub">DLC de ce stock de départ (optionnel, mais te permettra de recevoir une alerte avant péremption).</p>
        <div class="field"><label>DLC pour ces ${wiz.stock} ${escapeHtml(wiz.unite)}(s)</label><input type="date" id="wiz-dlc" value="${wiz.dlcDate}" /></div>`;
    }
    if(step==='recap'){
      const pu = wizPrixAchat();
      const info = wizTypeInfo(wiz.type);
      let detail = '';
      if(wiz.type==='unite' || wiz.type==='piece') detail = wizTypeInfo(wiz.type).label;
      else if(wiz.type==='lot' || wiz.type==='carton') detail = `${isFood?'Carton':'Lot'} de ${wiz.unitesParLot} ${wiz.unite}s — ${money(Number(wiz.prixLot)||0)}`;
      else if(wiz.type==='poids') detail = `${wiz.unitesParLot} kg — ${money(Number(wiz.prixLot)||0)}`;
      else detail = `Fût de ${wiz.volumeL} L → ${wiz.unitesParLot} ${wiz.unite}s de ${wiz.portionCl} cl — ${money(Number(wiz.prixLot)||0)}`;
      return `
        <h2 class="wiz-step-title">✅ On vérifie et c'est ajouté</h2>
        <div class="wiz-recap">
          <div class="wiz-recap-row"><span>Produit</span><span>${escapeHtml(wiz.nom)}</span></div>
          <div class="wiz-recap-row"><span>Type</span><span>${info.emoji} ${info.label}</span></div>
          <div class="wiz-recap-row"><span>Détail achat</span><span>${detail}</span></div>
          <div class="wiz-recap-row"><span>Prix par ${escapeHtml(wiz.unite)}</span><span>${money(pu)}</span></div>
          <div class="wiz-recap-row"><span>Stock de départ</span><span>${wiz.stock} ${escapeHtml(wiz.unite)}(s)</span></div>
          ${wiz.dlcDate ? `<div class="wiz-recap-row"><span>DLC</span><span>${new Date(wiz.dlcDate+'T00:00:00').toLocaleDateString('fr-FR')}</span></div>` : ''}
        </div>`;
    }
    return '';
  }

  window.wizUpdateStockFuts = function(){
    const nbFuts = Number(document.getElementById('wiz-stock-futs').value)||0;
    const hint = document.getElementById('wiz-stock-futs-hint');
    if(hint) hint.innerHTML = wiz.unitesParLot>0 ? `= ${Math.round(nbFuts*wiz.unitesParLot*10)/10} ${wiz.unite}(s) au total` : '';
  }

  window.wizUpdatePoids = function(){
    wiz.unitesParLot = Number(document.getElementById('wiz-poids-kg').value)||0;
    wiz.prixLot = Number(document.getElementById('wiz-poids-prix').value)||0;
    const hint = document.getElementById('wiz-poids-hint');
    const pu = wizPrixAchat();
    if(hint) hint.innerHTML = pu>0 ? `= <b>${money(pu)}</b> par kg` : 'Renseigne le poids et le prix pour voir le prix au kilo.';
  }

  window.wizSelectType = function(t){
    wiz.type = t;
    if(t==='unite' || t==='piece'){ wiz.conditionnement = "À l'unité"; wiz.unitesParLot = 1; }
    if(t==='lot' || t==='carton'){ wiz.conditionnement = "Carton de 6"; wiz.unitesParLot = 6; }
    if(t==='poids'){ wiz.conditionnement = "Au poids (kg)"; wiz.unite = 'kg'; wiz.unitesParLot = wiz.unitesParLot || 1; }
    if(t==='fut'){
      wiz.conditionnement = "Fût / vrac (calcul par volume)";
      wiz.volumeL = wiz.volumeL || 30;
      wiz.portionCl = wiz.portionCl || 25;
      wiz.unitesParLot = wiz.portionCl>0 ? Math.round((wiz.volumeL*100/wiz.portionCl)*10)/10 : 0;
    }
    wiz.idx = 0;
    wizNext();
  }

  window.wizPickLotSize = function(n){
    wiz.unitesParLot = n;
    wiz.conditionnement = n===6 ? 'Carton de 6' : n===12 ? 'Carton de 12' : n===24 ? 'Fardo de 24' : 'Lot personnalisé';
    wizRenderModal();
  }

  window.wizSetCustomLotSize = function(v){
    const n = Number(v)||0;
    wiz.unitesParLot = n;
    wiz.conditionnement = n===6 ? 'Carton de 6' : n===12 ? 'Carton de 12' : n===24 ? 'Fardo de 24' : 'Lot personnalisé';
    const picks = document.querySelectorAll('.wiz-quickpick');
    picks.forEach(p=>p.classList.remove('active'));
  }

  window.wizUpdateVolume = function(){
    wiz.volumeL = Number(document.getElementById('wiz-volume-l').value)||0;
    wiz.portionCl = Number(document.getElementById('wiz-portion-cl').value)||0;
    wiz.unitesParLot = wiz.portionCl>0 ? Math.round((wiz.volumeL*100/wiz.portionCl)*10)/10 : 0;
    const hint = document.getElementById('wiz-volume-hint');
    if(hint){
      hint.innerHTML = wiz.unitesParLot>0 ? `= environ <b>${wiz.unitesParLot} verres</b> de ${wiz.portionCl} cl par fût` : 'Renseigne la contenance et la portion pour voir le calcul.';
    }
  }

  window.wizUpdatePrix = function(){
    wiz.prixLot = Number(document.getElementById('wiz-prix').value)||0;
    const hint = document.getElementById('wiz-prix-hint');
    const pu = wizPrixAchat();
    const unite = wiz.unite || 'unité';
    if(hint) hint.innerHTML = pu>0 ? `= <b>${money(pu)}</b> par ${unite}` : "Renseigne le prix payé pour voir le prix à l'unité.";
  }

  function wizValidateCurrent(step){
    if(step==='nom'){
      const v = document.getElementById('wiz-nom').value.trim();
      if(!v){ showToast('Donne un nom au produit.', true); return false; }
      wiz.nom = v;
    }
    if(step==='lot'){
      if(wiz.type==='fut'){
        if(!(wiz.volumeL>0) || !(wiz.portionCl>0)){ showToast('Indique la contenance du fût et la taille de la portion.', true); return false; }
      } else {
        if(!(wiz.unitesParLot>0)){ showToast("Indique le nombre d'unités dans le lot.", true); return false; }
      }
    }
    if(step==='unite'){
      const v = document.getElementById('wiz-unite').value.trim();
      if(!v){ showToast("Indique le mot utilisé pour compter ce produit.", true); return false; }
      wiz.unite = v;
    }
    if(step==='prix'){
      wiz.prixLot = Number(document.getElementById('wiz-prix').value)||0;
    }
    if(step==='poids'){
      wiz.unitesParLot = Number(document.getElementById('wiz-poids-kg').value)||0;
      wiz.prixLot = Number(document.getElementById('wiz-poids-prix').value)||0;
      if(!(wiz.unitesParLot>0)){ showToast('Indique le poids acheté (en kg).', true); return false; }
    }
    if(step==='stock'){
      if(wiz.type === 'fut'){
        const nbFuts = Number(document.getElementById('wiz-stock-futs').value)||0;
        wiz.stock = Math.round(nbFuts*wiz.unitesParLot*10)/10;
      } else {
        wiz.stock = Number(document.getElementById('wiz-stock').value)||0;
      }
      wiz.seuilAlerte = Number(document.getElementById('wiz-seuil').value)||0;
    }
    if(step==='dlc'){
      wiz.dlcDate = document.getElementById('wiz-dlc').value || '';
    }
    return true;
  }

  window.wizCheckDuplicate = function(){
    const el = document.getElementById('wiz-nom');
    const warnDiv = document.getElementById('wiz-duplicate-warning');
    if(!el || !warnDiv) return;
    const val = el.value.trim().toLowerCase();
    warnDiv.innerHTML = '';
    if(val.length < 2) return;
    const match = catData().produits.find(p =>
      p.nom.toLowerCase() === val ||
      (val.length >= 3 && p.nom.toLowerCase().includes(val)) ||
      (p.nom.length >= 3 && val.includes(p.nom.toLowerCase()))
    );
    if(match){
      warnDiv.innerHTML = `<div class="field-hint" style="background:#FFF4E5; padding:9px 12px; border-radius:8px; color:var(--orange-dark); margin-top:10px; font-size:12.5px; line-height:1.4;">
        ⚠️ "<b>${escapeHtml(match.nom)}</b>" existe déjà (stock actuel : ${match.stock} ${escapeHtml(match.unite)}(s)).
        <span style="text-decoration:underline; cursor:pointer; font-weight:700;" onclick="wiz=null; closeModal(); openRestockModal('${match.id}');">Réapprovisionner ce produit à la place →</span>
      </div>`;
    }
  }

  window.wizNext = function(){
    const steps = wizSteps();
    const step = steps[wiz.idx];
    if(step && !wizValidateCurrent(step)) return;
    if(step === 'recap'){ wizSave(); return; }
    if(wiz.idx < steps.length-1){ wiz.idx++; }
    wizRenderModal();
  }

  window.wizBack = function(){
    if(wiz.idx > 0){ wiz.idx--; wizRenderModal(); }
  }

  function wizSave(){
    const unitesParLot = Number(wiz.unitesParLot)||1;
    const prixLot = Number(wiz.prixLot)||0;
    const prixAchat = wizPrixAchat();
    const data = {
      nom: wiz.nom, unite: wiz.unite || 'unité', conditionnement: wiz.conditionnement,
      unitesParLot, prixLot, prixAchat,
      stock: Number(wiz.stock)||0, seuilAlerte: Number(wiz.seuilAlerte)||0,
      historiquePrix: prixLot>0 ? [{date:new Date().toISOString(), prixAchat, prixLot, conditionnement:wiz.conditionnement, unitesParLot}] : []
    };
    if(wiz.type==='fut'){ data.volumeL = Number(wiz.volumeL)||0; data.portionCl = Number(wiz.portionCl)||0; }
    if(wiz.dlcDate && Number(wiz.stock)>0){
      data.dlcLots = [{id:uid(), date:wiz.dlcDate, quantite:Number(wiz.stock)}];
    }
    const nouveauProduit = {id:uid(), ...data};
    catData().produits.push(nouveauProduit);
    saveProduitDoc(activeCat, nouveauProduit);
    closeModal();
    const nomSauve = data.nom, uniteSauve = data.unite, puSauve = prixAchat;
    wiz = null;
    render();
    showToast(`"${nomSauve}" ajouté — ${money(puSauve)} / ${uniteSauve}`);
  }

  function wizRenderModal(){
    const steps = wizSteps();
    const step = steps[wiz.idx];
    const dots = steps.map((s,i)=> `<div class="wiz-dot ${i<wiz.idx?'done':(i===wiz.idx?'current':'')}"></div>`).join('');
    const isFirst = wiz.idx===0;
    const isLast = step==='recap';
    document.getElementById('modal-container').innerHTML = `
      <div class="modal-bg" onclick="if(event.target===this){ wiz=null; closeModal(); }">
        <div class="modal wiz-modal">
          <div class="wiz-progress">${dots}</div>
          ${wizStepBody(step)}
          <div class="wiz-nav">
            ${isFirst ? `<button class="wiz-back" onclick="wiz=null; closeModal();">Annuler</button>` : `<button class="wiz-back" onclick="wizBack()">◀ Retour</button>`}
            ${step==='type' ? '' : `<button class="btn-primary" onclick="wizNext()">${isLast ? '✅ Ajouter le produit' : 'Suivant →'}</button>`}
          </div>
        </div>
      </div>`;
    if(step==='nom'){ const el=document.getElementById('wiz-nom'); if(el) el.focus(); }
  }
  // ================= FIN ASSISTANT "NOUVEAU PRODUIT" =================

  window.checkDuplicateName = function(){
    const el = document.getElementById('f-nom');
    const warnDiv = document.getElementById('duplicate-warning');
    if(!el || !warnDiv) return;
    const val = el.value.trim().toLowerCase();
    warnDiv.innerHTML = '';
    if(val.length < 2) return;
    const match = catData().produits.find(p =>
      p.id !== currentEditingProductId &&
      (p.nom.toLowerCase() === val ||
       (val.length >= 3 && p.nom.toLowerCase().includes(val)) ||
       (p.nom.length >= 3 && val.includes(p.nom.toLowerCase())))
    );
    if(match){
      warnDiv.innerHTML = `<div class="field-hint" style="background:#FFF4E5; padding:9px 12px; border-radius:8px; color:var(--orange-dark); margin:-4px 0 10px 0; font-size:12.5px; line-height:1.4;">
        ⚠️ "<b>${escapeHtml(match.nom)}</b>" existe déjà (stock actuel : ${match.stock} ${escapeHtml(match.unite)}(s)).
        <span style="text-decoration:underline; cursor:pointer; font-weight:700;" onclick="closeModal(); openRestockModal('${match.id}');">Réapprovisionner ce produit à la place →</span>
      </div>`;
    }
  }

  window.openProductModal = function(id){
    const editing = id ? catData().produits.find(p=>p.id===id) : null;
    currentEditingProductId = id || null;
    const defaultCond = editing ? editing.conditionnement : "À l'unité";
    document.getElementById('modal-container').innerHTML = `
      <div class="modal-bg" onclick="if(event.target===this) closeModal()">
        <div class="modal">
          <h2>${editing?'Modifier le produit':'Nouveau produit'}</h2>
          <div class="field"><label>Nom</label><input type="text" id="f-nom" value="${editing?escapeHtml(editing.nom):''}" placeholder="Ex. Coca-Cola 33cl" oninput="checkDuplicateName()" autocomplete="off" /></div>
          <div id="duplicate-warning"></div>
          <div class="field"><label>Unité de comptage (utilisée pour l'inventaire)</label><input type="text" id="f-unite" value="${editing?escapeHtml(editing.unite):catInfo().unite}" placeholder="Ex. canette, bouteille, kg" /></div>
          <div class="field">
            <label>J'achète par</label>
            <select id="f-cond" onchange="updateCondDefault()">${condOptions(defaultCond)}</select>
          </div>
          <div id="f-lot-fields"></div>
          <div class="field">
            <label>Prix payé pour ce lot</label>
            <input type="number" step="0.01" min="0" id="f-prix-lot" value="${editing?editing.prixLot:''}" oninput="updatePrixCalc()" />
          </div>
          <div class="field-hint" id="prix-calc-hint"></div>
          <div class="field-row">
            <div id="f-stock-field" style="flex:1;"></div>
            <div class="field"><label>Seuil d'alerte (stock bas)</label><input type="number" step="0.01" min="0" id="f-seuil" value="${editing&&editing.seuilAlerte?editing.seuilAlerte:0}" /></div>
          </div>
          ${(activeCat==='nourriture' && editing) ? `
          <div class="field">
            <label>⏰ Lots DLC</label>
            <div id="dlc-lots-list">${dlcLotsListHTML(editing)}</div>
            <div class="field-row" style="margin-top:8px;">
              <div class="field"><input type="date" id="f-new-dlc-date" /></div>
              <div class="field"><input type="number" step="0.01" min="0" id="f-new-dlc-qte" placeholder="Quantité" /></div>
              <button type="button" class="btn-secondary" onclick="addDlcLotInline('${editing.id}')" style="height:38px;">+ Ajouter</button>
            </div>
          </div>` : ''}
          <div class="modal-actions">
            <button class="btn-secondary" onclick="closeModal()">Annuler</button>
            <button class="btn-primary" onclick="saveProduct('${editing?editing.id:''}')">${editing?'Enregistrer':'Ajouter'}</button>
          </div>
        </div>
      </div>`;
    renderLotFields('f', editing);
    renderStockField('f', editing);
  }

  function dlcLotsListHTML(p){
    const lots = (p.dlcLots||[]).slice().sort((a,b)=> joursRestantsDLC(a.date)-joursRestantsDLC(b.date));
    if(lots.length===0) return `<p class="note" style="margin:4px 0;">Aucun lot DLC pour l'instant.</p>`;
    return lots.map(l => {
      const j = joursRestantsDLC(l.date);
      const urg = dlcUrgence(j);
      const colors = { expired:'var(--red)', critique:'var(--red)', proche:'var(--orange-dark)', ok:'var(--green)' };
      return `<div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); font-size:12.5px;">
        <span>${l.quantite} ${escapeHtml(p.unite)}(s) — DLC ${new Date(l.date+'T00:00:00').toLocaleDateString('fr-FR')} <b style="color:${colors[urg]};">(${j<0?Math.abs(j)+'j dépassé':j+'j'})</b></span>
        <span style="cursor:pointer; color:var(--ink-soft);" onclick="removeDlcLotInline('${p.id}','${l.id}')">🗑</span>
      </div>`;
    }).join('');
  }

  window.addDlcLotInline = function(productId){
    const dateEl = document.getElementById('f-new-dlc-date');
    const qteEl = document.getElementById('f-new-dlc-qte');
    const date = dateEl.value;
    const qte = Number(qteEl.value)||0;
    if(!date || qte<=0){ showToast('Indique une date et une quantité.', true); return; }
    const p = catData().produits.find(x=>x.id===productId);
    p.dlcLots = [{id:uid(), date, quantite:qte}, ...(p.dlcLots||[])];
    saveProduitDoc(activeCat, p);
    document.getElementById('dlc-lots-list').innerHTML = dlcLotsListHTML(p);
    dateEl.value=''; qteEl.value='';
    render();
  }

  window.removeDlcLotInline = function(productId, dlcId){
    const p = catData().produits.find(x=>x.id===productId);
    p.dlcLots = (p.dlcLots||[]).filter(l => l.id !== dlcId);
    saveProduitDoc(activeCat, p);
    const listEl = document.getElementById('dlc-lots-list');
    if(listEl) listEl.innerHTML = dlcLotsListHTML(p);
    render();
  }

  function renderLotFields(prefix, editing){
    const sel = document.getElementById(prefix+'-cond').value;
    const cond = CONDITIONNEMENTS.find(c => c.label===sel);
    const container = document.getElementById(prefix+'-lot-fields');
    if(cond && cond.volumique){
      const volumeL = editing && editing.volumeL ? editing.volumeL : '';
      const portionCl = editing && editing.portionCl ? editing.portionCl : 25;
      container.innerHTML = `
        <div class="field-row">
          <div class="field"><label>Volume du contenant (litres)</label><input type="number" step="0.01" min="0" id="${prefix}-volume-l" value="${volumeL}" oninput="updateVolumeCalc('${prefix}')" placeholder="Ex. 30" /></div>
          <div class="field"><label>Taille de la portion servie (cl)</label><input type="number" step="0.01" min="0" id="${prefix}-portion-cl" value="${portionCl}" oninput="updateVolumeCalc('${prefix}')" placeholder="Ex. 25" /></div>
        </div>
        <input type="hidden" id="${prefix}-unites-lot" value="${editing?editing.unitesParLot:0}" />
      `;
      updateVolumeCalc(prefix);
    } else {

  window.updateVolumeCalc = function(prefix){

    const portionCl = Number(document.getElementById(prefix+'-portion-cl').value)||0;
    const unitesInput = document.getElementById(prefix+'-unites-lot');
    const unites = portionCl > 0 ? (volumeL*100)/portionCl : 0;
    unitesInput.value = Math.round(unites*10)/10;
    if(prefix === 'f'){ updatePrixCalc(); updateStockFutsHint(prefix); }

  window.updateCondDefault = function(){

  function renderStockField(prefix, editing){
    const sel = document.getElementById(prefix+'-cond').value;
    const cond = CONDITIONNEMENTS.find(c => c.label===sel);
    const container = document.getElementById(prefix+'-stock-field');

        <label>Nombre de fûts complets déjà en stock</label>

  window.updateStockFutsHint = function(prefix){
    const nbFutsEl = document.getElementById(prefix+'-stock-futs');

    const unitesParLotEl = document.getElementById(prefix+'-unites-lot');

  window.updatePrixCalc = function(){
    const unitesEl = document.getElementById('f-unites-lot');
    const unites = unitesEl ? Number(unitesEl.value)||0 : 0;
    const prixLot = Number(document.getElementById('f-prix-lot').value)||0;
    const hint = document.getElementById('prix-calc-hint');
    if(unites > 0 && prixLot > 0){
      hint.textContent = `= ${money(prixLot/unites)} par unité`;

  window.saveProduct = function(id){
    const nom = document.getElementById('f-nom').value.trim();
    if(!nom){ showToast("Le nom du produit est requis.", true); return; }
    const cond = CONDITIONNEMENTS.find(c => c.label===document.getElementById('f-cond').value);
    const unitesParLot = Number(document.getElementById('f-unites-lot').value)||1;
    const prixLot = Number(document.getElementById('f-prix-lot').value)||0;
    const nouveauPrixAchat = unitesParLot > 0 ? prixLot/unitesParLot : 0;
    let stock;
    if(cond && cond.volumique){
      const nbFuts = Number(document.getElementById('f-stock-futs').value)||0;
      stock = Math.round(nbFuts*unitesParLot*10)/10;
    } else {
      stock = Number(document.getElementById('f-stock').value)||0;
    }
    const data = {
      nom,
      unite: document.getElementById('f-unite').value.trim() || 'unité',
      conditionnement: document.getElementById('f-cond').value,
      unitesParLot,
      prixLot,
      prixAchat: nouveauPrixAchat,
      stock,
      seuilAlerte: Number(document.getElementById('f-seuil').value)||0,
    };
    if(cond && cond.volumique){
      data.volumeL = Number(document.getElementById('f-volume-l').value)||0;
      data.portionCl = Number(document.getElementById('f-portion-cl').value)||0;
    } else {
      data.volumeL = undefined;
      data.portionCl = undefined;
    }
    let produitFinal;
    if(id){
      const idx = catData().produits.findIndex(p=>p.id===id);
      const ancien = catData().produits[idx];
      data.historiquePrix = ancien.historiquePrix || [];
      if(prixLot > 0 && ancien.prixAchat !== nouveauPrixAchat){
        data.historiquePrix = [{date:new Date().toISOString(), prixAchat:nouveauPrixAchat, prixLot, conditionnement:data.conditionnement, unitesParLot}, ...data.historiquePrix];
      }
      produitFinal = {...ancien, ...data};
      catData().produits[idx] = produitFinal;
    } else {
      data.historiquePrix = prixLot > 0 ? [{date:new Date().toISOString(), prixAchat:nouveauPrixAchat, prixLot, conditionnement:data.conditionnement, unitesParLot}] : [];
      produitFinal = {id:uid(), ...data};
      catData().produits.push(produitFinal);
    }
    saveProduitDoc(activeCat, produitFinal);
    closeModal(); render();
  }

  window.updateRestockCalc = function(id){
    const p = catData().produits.find(x=>x.id===id);
    const unites = Number(document.getElementById('r-unites-lot').value)||0;
    const nbLots = Number(document.getElementById('r-nb-lots').value)||0;
    const prixLot = Number(document.getElementById('r-prix-lot').value)||0;
    const totalUnites = unites*nbLots;
    const hint = document.getElementById('restock-calc-hint');
    if(unites>0 && prixLot>0){
      hint.textContent = `= ${totalUnites} ${p.unite}(s) ajoutée(s), à ${money(prixLot/unites)} par ${p.unite}`;
    } else {
      hint.textContent = '';
    }
  }

  window.confirmRestock = function(id){
    const p = catData().produits.find(x=>x.id===id);
    const cond = CONDITIONNEMENTS.find(c => c.label===document.getElementById('r-cond').value);
    const unitesParLot = Number(document.getElementById('r-unites-lot').value)||1;
    const nbLots = Number(document.getElementById('r-nb-lots').value)||0;
    const prixLot = Number(document.getElementById('r-prix-lot').value)||0;
    const conditionnement = document.getElementById('r-cond').value;
    const quantiteAjoutee = unitesParLot*nbLots;
    p.stock += quantiteAjoutee;
    if(prixLot > 0){
      p.conditionnement = conditionnement;
      p.unitesParLot = unitesParLot;
      p.prixLot = prixLot;
      p.prixAchat = unitesParLot > 0 ? prixLot/unitesParLot : p.prixAchat;
      if(cond && cond.volumique){
        p.volumeL = Number(document.getElementById('r-volume-l').value)||0;
        p.portionCl = Number(document.getElementById('r-portion-cl').value)||0;
      }
      p.historiquePrix = [{date:new Date().toISOString(), prixAchat:p.prixAchat, prixLot, conditionnement, unitesParLot}, ...(p.historiquePrix||[])];
    }
    const dlcEl = document.getElementById('r-dlc');
    if(dlcEl && dlcEl.value && quantiteAjoutee>0){
      p.dlcLots = [{id:uid(), date:dlcEl.value, quantite:quantiteAjoutee}, ...(p.dlcLots||[])];
    }
    saveProduitDoc(activeCat, p); closeModal(); render();
  }

  window.startService = function(){
    if(catData().serviceEnCours && catData().serviceEnCours.awaitingInventaire){
      showToast("Termine d'abord l'inventaire en attente avant de relancer un service.", true);
      return;
    }
    const prestation = document.getElementById('svc-prestation').value.trim();
    const auteur = document.getElementById('svc-auteur').value.trim();
    if(!auteur){ showToast("Indique qui réalise le service.", true); return; }
    const futs = catData().produits.filter(p => futInfo(p) !== null);
    const stockDepart = {};
    futs.forEach(p => stockDepart[p.id] = p.stock);
    catData().serviceEnCours = { active:true, prestation, auteur, debut:new Date().toISOString(), stockDepart, tally:{} };
    saveData();
    render();
  }

  window.tapService = function(id, delta){
    const p = catData().produits.find(x=>x.id===id);
    const session = catData().serviceEnCours;
    if(!p || !session || !session.active) return;
    if(delta > 0){
      if(p.stock <= 0){ showToast('Fût vide — tape un nouveau fût dans "Mon stock" avant de continuer.', true); return; }
      p.stock -= 1;
      session.tally[id] = (session.tally[id]||0) + 1;
    } else {
      if((session.tally[id]||0) <= 0) return;
      p.stock += 1;
      session.tally[id] = session.tally[id] - 1;
    }
    saveProduitDoc(activeCat, p);
    saveData();
    renderServiceView();
  }

  async function saveHistoriqueEntry(catId, entry){

      await db.collection(HISTO_COLLECTION).doc(entry.id).set({...entry, catId});
      delete historiqueCache[catId];
      historiqueLastDoc[catId] = null;
      bilanCache = null;
      dashboardActivityCache = null;
    }catch(e){
      console.error(e);
      showToast("Erreur d'enregistrement de l'inventaire (" + (e.code||e.message) + ").", true);
    }
  }

  function endService(){
    const session = catData().serviceEnCours;

    catData().serviceEnCours = {
      active:false,
      awaitingInventaire:true,
      stockDepart: session.stockDepart,

      auteur: session.auteur
    };
    saveData();
    activeView = 'inventaire';

  function renderInventaireView(){
    const produits = catData().produits.slice().sort((a,b)=>a.nom.localeCompare(b.nom));
    const flowActive = prestationFlow && prestationFlow.active && prestationFlow.order[prestationFlow.stepIdx] === activeCat;
    if(produits.length===0){
      document.getElementById('panel').innerHTML = `<div class="empty-state">
        <b>Aucun produit à inventorier</b>Ajoute d'abord des produits dans l'onglet "Mon stock".
        ${flowActive ? `<div style="margin-top:14px;"><button class="btn-primary" onclick="advancePrestationFlow()">Passer cette catégorie →</button></div>` : ''}
      </div>`;
      return;
    }
    const pending = (catData().serviceEnCours && catData().serviceEnCours.awaitingInventaire) ? catData().serviceEnCours : null;
    let totalSortiCout = 0;
    let html = '';
    if(flowActive){
      const noms = { boissons:'🥤 Boissons', nourriture:'🍽️ Nourriture', consommables:'🧴 Consommables' };
      const etapes = prestationFlow.order.map((c,i) => `${i<prestationFlow.stepIdx?'✅':(i===prestationFlow.stepIdx?'▶️':'⚪')} ${noms[c]}`).join('&nbsp;&nbsp;→&nbsp;&nbsp;');
      html += `<div class="service-header">
        <div>🏁 Fin de prestation${prestationFlow.prestation ? ' — <b>'+escapeHtml(prestationFlow.prestation)+'</b>' : ''}<div class="note" style="margin:4px 0 0 0; color:#ffffffcc;">${etapes}</div></div>
        <button class="btn-secondary" onclick="cancelPrestationFlow()">Annuler ce parcours</button>
      </div>`;
    }
    if(pending){
      const totalTally = Object.values(pending.tally||{}).reduce((s,n)=>s+n,0);
      html += `<div class="service-header">
        <div>🍺 Service bière terminé${pending.prestation ? ' — <b>'+escapeHtml(pending.prestation)+'</b>' : ''}<div class="note" style="margin:2px 0 0 0;">${totalTally} verre(s) déjà comptés — compte le reste des boissons ci-dessous, puis valide pour tout envoyer ensemble.</div></div>
      </div>`;
    }
    html += `<p class="note" style="margin-top:0;">Pour chaque article, indique combien a été <b>consommé</b> pendant la prestation — pas ce qu'il reste, le site calcule ça tout seul.</p>
    <table><thead><tr>
      <th>Produit</th><th style="text-align:right">Stock avant</th><th style="text-align:right">Consommé</th><th style="text-align:right">Reste</th><th style="text-align:right">Coût sorti</th>
    </tr></thead><tbody>`;
    produits.forEach(p => {
      const stockAvant = (pending && pending.stockDepart && pending.stockDepart[p.id] !== undefined) ? pending.stockDepart[p.id] : p.stock;
      const compte = comptages.hasOwnProperty(p.id) ? comptages[p.id] : p.stock;
      const sorti = stockAvant - compte;
      const cout = sorti * p.prixAchat;
      totalSortiCout += cout;
      const dejaCompte = pending && pending.stockDepart && pending.stockDepart[p.id] !== undefined;
      html += `<tr>
        <td data-label="Produit">${escapeHtml(p.nom)} <span style="color:var(--ink-soft); font-size:11px;">(${escapeHtml(p.unite)})</span></td>
        <td data-label="Stock avant" class="num">${stockAvant}</td>
        <td data-label="Consommé">
          ${dejaCompte
            ? `<span class="badge-alert" style="background:var(--navy);">🍺 ${sorti} servis</span>`
            : `<button class="consume-btn ${sorti>0?'filled':''}" onclick="openConsumeModal('${p.id}')">${sorti>0 ? `✏️ ${sorti} ${escapeHtml(p.unite)}(s)` : '📝 Compter'}</button>`
          }
        </td>
        <td data-label="Reste" class="num ${compte<0?'sorti-neg':''}">${compte}</td>
        <td data-label="Coût sorti" class="num">${money(cout)}</td>
      </tr>`;
    });
    html += `</tbody></table>
    <div class="stats-row" style="margin-top:16px;">
      <div class="stat-card"><b>${money(totalSortiCout)}</b><small>Coût total sorti (pour calcul de marge)</small></div>
    </div>
    <div class="toolbar">
      <div></div>
      ${flowActive
        ? `<button class="btn-primary" onclick="advancePrestationFlow()">${prestationFlow.stepIdx < prestationFlow.order.length-1 ? 'Suivant : '+({boissons:'🥤 Boissons',nourriture:'🍽️ Nourriture',consommables:'🧴 Consommables'}[prestationFlow.order[prestationFlow.stepIdx+1]])+' →' : '✅ Terminer et envoyer le rapport'}</button>`
        : `<button class="btn-primary" onclick="openValidateModal()">Valider l'inventaire</button>`
      }
    </div>`;
    document.getElementById('panel').innerHTML = html;
  }

  window.advancePrestationFlow = async function(){
    const catId = activeCat;
    const pending = (catData().serviceEnCours && catData().serviceEnCours.awaitingInventaire) ? catData().serviceEnCours : null;
    const produits = catData().produits;
    const lignes = [];
    let totalCout = 0;
    const produitsModifies = [];
    produits.forEach(p => {
      const stockAvant = (pending && pending.stockDepart && pending.stockDepart[p.id] !== undefined) ? pending.stockDepart[p.id] : p.stock;
      const compte = comptages.hasOwnProperty(p.id) ? comptages[p.id] : p.stock;
      const sorti = stockAvant - compte;
      const cout = sorti * p.prixAchat;
      totalCout += cout;
      lignes.push({ produitId:p.id, nom:p.nom, unite:p.unite, stockAvant, compte, sorti, cout });
      if(compte !== p.stock){ p.stock = compte; produitsModifies.push(p); }
    });

    const entry = { id: uid(), date:new Date().toISOString(), auteur:prestationFlow.auteur, prestation:prestationFlow.prestation, lignes, totalCout };
    if(pending) catData().serviceEnCours = { active:false };
    try{
      if(produitsModifies.length > 0){
        const batch = db.batch();
        produitsModifies.forEach(p => {
          const clean = JSON.parse(JSON.stringify(p));
          clean.catId = catId;
          batch.set(db.collection(PRODUITS_COLLECTION).doc(p.id), clean);
        });
        await batch.commit();
      }
    }catch(e){
      console.error(e);
      showToast("Erreur lors de la mise à jour du stock (" + (e.code||e.message) + ").", true);
    }
    saveData();
    saveHistoriqueEntry(catId, entry);
    prestationFlow.entries[catId] = entry;
    comptages = {};

    if(prestationFlow.stepIdx < prestationFlow.order.length - 1){
      prestationFlow.stepIdx++;
      const noms = { boissons:'🥤 Boissons', nourriture:'🍽️ Nourriture', consommables:'🧴 Consommables' };
      const nextCat = prestationFlow.order[prestationFlow.stepIdx];
      setCat(nextCat);
      setView('inventaire');
      showToast(`Étape suivante : ${noms[nextCat]}`);
    } else {
      launchConfetti();
      envoyerEmailCombine(prestationFlow);
      setTimeout(()=>exporterBackupJSON(), 400);
      const flowTermine = prestationFlow;
      prestationFlow = null;
      render();
      const totalGeneral = Object.values(flowTermine.entries).reduce((s,e)=>s+e.totalCout,0);
      showToast(`🏁 Prestation terminée — ${money(totalGeneral)} au total, rapport envoyé.`);
    }
  }

  function envoyerEmailCombine(flow){
    const dateStr = new Date().toLocaleString('fr-FR');
    const noms = { boissons:'Boissons', nourriture:'Nourriture', consommables:'Consommables' };
    let body = `Fin de prestation — ${dateStr}\n${flow.prestation ? 'Prestation : '+flow.prestation+'\n' : ''}Réalisé par : ${flow.auteur}\n\n`;
    let totalGeneral = 0;
    flow.order.forEach(catId => {
      const entry = flow.entries[catId];

      body += `--- ${noms[catId]} ---\n`;
      entry.lignes.forEach(l => {
        if(l.sorti === 0) return;
        body += `${l.nom} (${l.unite}) : avant ${l.stockAvant} -> compté ${l.compte} | sorti ${l.sorti} | coût ${money(l.cout)}\n`;
      });
      body += `Sous-total ${noms[catId]} : ${money(entry.totalCout)}\n\n`;
      totalGeneral += entry.totalCout;

    body += `COÛT TOTAL DE LA PRESTATION : ${money(totalGeneral)}`;
    const subject = `Fin de prestation${flow.prestation ? ' - '+flow.prestation : ''} - ${dateStr}`;
    const mailto = `mailto:${encodeURIComponent(state.emailBackup)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

  async function deleteHistoriqueEntry(catId, entryId){
    const doc = await db.collection(HISTO_COLLECTION).doc(entryId).get();
    if(!doc.exists) return false;
    const entry = doc.data();
    const cd = state.data[catId];
    const produitsModifies = [];
    entry.lignes.forEach(l => {
      const p = cd.produits.find(x => x.id === l.produitId);
      if(p){ p.stock = l.stockAvant; produitsModifies.push(p); }
    });
    if(produitsModifies.length > 0){
      const batch = db.batch();
      produitsModifies.forEach(p => {
        const clean = JSON.parse(JSON.stringify(p));
        clean.catId = catId;
        batch.set(db.collection(PRODUITS_COLLECTION).doc(p.id), clean);
      });
      await batch.commit();
    }
    await db.collection(HISTO_COLLECTION).doc(entryId).delete();
    if(historiqueCache[catId]) historiqueCache[catId] = historiqueCache[catId].filter(e => e.id !== entryId);
    if(bilanCache) bilanCache = bilanCache.filter(e => e.id !== entryId);
    if(dashboardActivityCache) dashboardActivityCache = dashboardActivityCache.filter(e => e.id !== entryId);
    return true;
  }

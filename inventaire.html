  // ---------- SAUVEGARDE TÉLÉCHARGEABLE (indépendante de Firebase) ----------
  window.exporterBackupJSON = function(){
    const backup = {
      type: 'manifeste-backup',
      version: 1,
      exportedAt: new Date().toISOString(),
      emailBackup: state.emailBackup || '',
      produits: {}
    };
    CATEGORIES.forEach(c => { backup.produits[c.id] = (state.data[c.id] && state.data[c.id].produits) || []; });
    const json = JSON.stringify(backup, null, 2);
    const blob = new Blob([json], {type:'application/json;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const horodatage = new Date().toISOString().slice(0,16).replace('T','-').replace(':','h');
    a.href = url;
    a.download = `sauvegarde-stock-${horodatage}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('💾 Sauvegarde téléchargée sur cet appareil.');
  }

  window.handleImportBackupFile = function(evt){
    const file = evt.target.files[0];
    evt.target.value = '';
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
      let backup;
      try{ backup = JSON.parse(e.target.result); }
      catch(err){ showToast("Ce fichier n'est pas une sauvegarde valide (JSON illisible).", true); return; }
      if(!backup || backup.type !== 'manifeste-backup' || !backup.produits){
        showToast("Ce fichier ne ressemble pas à une sauvegarde de ce site.", true);
        return;
      }
      openRestoreConfirm(backup);
    };
    reader.readAsText(file);
  }

  let pendingRestoreBackup = null;

  function openRestoreConfirm(backup){
    pendingRestoreBackup = backup;
    const dateStr = backup.exportedAt ? new Date(backup.exportedAt).toLocaleString('fr-FR') : 'date inconnue';
    let recap = '';
    let total = 0;
    CATEGORIES.forEach(c => {
      const n = (backup.produits[c.id]||[]).length;
      total += n;
      recap += `<div class="wiz-recap-row"><span>${c.label}</span><span>${n} produit(s)</span></div>`;
    });
    document.getElementById('modal-container').innerHTML = `
      <div class="modal-bg" onclick="if(event.target===this) closeModal()">
        <div class="modal">
          <h2>📤 Restaurer cette sauvegarde ?</h2>
          <p class="note">Sauvegarde du <b>${dateStr}</b> — ${total} produit(s) au total.</p>
          <div class="wiz-recap">${recap}</div>
          <p class="note" style="margin-top:12px; color:var(--orange-dark); font-weight:600;">Chaque produit de la sauvegarde remplacera le produit correspondant actuel (même nom = même produit). Les produits actuels qui n'existent pas dans la sauvegarde ne seront pas supprimés.</p>
          <div class="modal-actions">
            <button class="btn-secondary" onclick="closeModal()">Annuler</button>
            <button class="btn-primary" onclick="confirmRestoreBackup()">Restaurer</button>
          </div>
        </div>
      </div>`;
  }

  window.confirmRestoreBackup = async function(){
    const backup = pendingRestoreBackup;
    if(!backup) return;
    closeModal();
    showToast('Restauration en cours…');
    try{
      for(const c of CATEGORIES){
        const produitsBackup = backup.produits[c.id] || [];
        const produitsActuels = (state.data[c.id] && state.data[c.id].produits) || [];
        for(let i=0; i<produitsBackup.length; i+=400){
          const chunk = produitsBackup.slice(i, i+400);
          const batch = db.batch();
          chunk.forEach(pBackup => {
            const existant = produitsActuels.find(p => p.nom.trim().toLowerCase() === pBackup.nom.trim().toLowerCase());
            const id = existant ? existant.id : (pBackup.id || uid());
            const clean = JSON.parse(JSON.stringify(pBackup));
            clean.id = id;
            clean.catId = c.id;
            batch.set(db.collection(PRODUITS_COLLECTION).doc(id), clean);
          });
          await batch.commit();
        }
      }
      pendingRestoreBackup = null;
      showToast('✅ Sauvegarde restaurée avec succès.');
      launchConfetti();
    }catch(e){
      console.error(e);
      showToast("Erreur pendant la restauration (" + (e.code||e.message) + ").", true);
    }
  }

  window.exporterCSV = async function(){
    const cat = catInfo();
    showToast("Préparation de l'export…");
    let entries;
    try{ entries = await fetchFullHistorique(cat.id); }
    catch(e){ console.error(e); showToast("Erreur lors de l'export.", true); return; }
    const rows = [['Date','Prestation','Catégorie','Réalisé par','Produit','Unité','Stock avant','Compté','Sorti','Prix unitaire','Coût sorti']];
    entries.forEach(e => {
      const dateStr = new Date(e.date).toLocaleString('fr-FR');
      e.lignes.forEach(l => {
        const prixUnitaire = l.sorti !== 0 ? (l.cout/l.sorti) : 0;
        rows.push([dateStr, e.prestation||'', cat.label, e.auteur, l.nom, l.unite, l.stockAvant, l.compte, l.sorti, prixUnitaire.toFixed(2), l.cout.toFixed(2)]);
      });
    });
    const csv = rows.map(r => r.map(v => {
      const s = String(v).replace(/"/g,'""');
      return /[",;\n]/.test(s) ? `"${s}"` : s;
    }).join(';')).join('\r\n');
    const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `historique-${cat.id}-${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  window.closeModal = function(){ document.getElementById('modal-container').innerHTML=''; }

  function render(){
    if(!loaded) return;
    document.getElementById('inv-subtitle').textContent = "Gestion de stock & inventaires de prestation";
    checkDlcAlerts();
    renderCatTabs();
    if(activeCat === 'dashboard'){
      document.getElementById('page-title-bar').innerHTML = '';
      document.getElementById('view-tabs').innerHTML = '';
      renderDashboardView();
      return;
    }
    if(activeCat === 'bilan'){
      document.getElementById('page-title-bar').innerHTML = `<h2 class="page-title">📊 Bilan prestations</h2>`;
      document.getElementById('view-tabs').innerHTML = '';
      renderBilanView();
      return;
    }
    const cat = CATEGORIES.find(c => c.id === activeCat);
    const nbProduits = (state.data[activeCat] && state.data[activeCat].produits) ? state.data[activeCat].produits.length : 0;
    document.getElementById('page-title-bar').innerHTML = `
      <h2 class="page-title">${cat.label}</h2>
      <span class="page-title-count">${nbProduits} produit${nbProduits>1?'s':''} suivi${nbProduits>1?'s':''}</span>`;
    renderViewTabs();
    if(activeView==='stock') renderStockView();
    else if(activeView==='service') renderServiceView();
    else if(activeView==='inventaire') renderInventaireView();
    else if(activeView==='dlc') renderDLCView();
    else renderHistoriqueView();
  }

  // ---------- VUE : TABLEAU DE BORD ----------
  let dashboardActivityCache = null;

  function renderDashboardChartsHTML(){
    if(dashboardActivityError){
      return `<div class="empty-state" style="padding:16px;"><b>⚠️ Statistiques indisponibles</b></div>`;
    }
    if(dashboardActivityCache === null){
      return `<div class="empty-state" style="padding:16px;"><b>Chargement…</b></div>`;
    }
    if(dashboardActivityCache.length === 0){
      return `<div class="empty-state" style="padding:16px;"><b>Pas encore assez de données</b>Les statistiques apparaîtront après quelques inventaires validés.</div>`;
    }
    const parProduit = {};
    dashboardActivityCache.forEach(e => {
      (e.lignes||[]).forEach(l => {
        if(l.sorti <= 0) return;
        parProduit[l.nom] = (parProduit[l.nom]||0) + l.cout;
      });
    });
    const topProduits = Object.entries(parProduit).sort((a,b)=>b[1]-a[1]).slice(0,6);
    const maxProduit = topProduits.length ? topProduits[0][1] : 1;

    const trend = dashboardActivityCache.slice().reverse();
    const maxTrend = Math.max(...trend.map(e=>e.totalCout), 1);

    let html = `<div class="charts-grid">`;

    html += `<div class="chart-card"><div class="chart-title">🏆 Produits les plus consommés</div>`;
    if(topProduits.length===0){
      html += `<p class="note">Pas encore de données.</p>`;
    } else {
      topProduits.forEach(([nom, cout]) => {
        const pct = Math.max(4, Math.round((cout/maxProduit)*100));
        html += `<div class="bar-row">
          <span class="bar-label">${escapeHtml(nom)}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%;"></div></div>
          <span class="bar-value">${money(cout)}</span>
        </div>`;
      });
    }
    html += `</div>`;

    html += `<div class="chart-card"><div class="chart-title">📈 Coût des dernières prestations</div>`;
    if(trend.length===0){
      html += `<p class="note">Pas encore de données.</p>`;
    } else {
      html += `<div class="trend-chart">`;
      trend.forEach(e => {
        const h = Math.max(6, Math.round((e.totalCout/maxTrend)*100));
        const label = e.prestation ? e.prestation : new Date(e.date).toLocaleDateString('fr-FR');
        const shortLabel = label.length>9 ? label.slice(0,8)+'…' : label;
        html += `<div class="trend-bar-wrap" title="${escapeHtml(label)} — ${money(e.totalCout)}">
          <div class="trend-bar" style="height:${h}%;"></div>
          <span class="trend-bar-label">${escapeHtml(shortLabel)}</span>
        </div>`;
      });
      html += `</div>`;
    }
    html += `</div></div>`;
    return html;
  }

  async function loadDashboardActivity(){
    dashboardActivityError = false;
    try{
      const snap = await db.collection(HISTO_COLLECTION).orderBy('date','desc').limit(8).get();
      dashboardActivityCache = [];
      snap.forEach(doc => dashboardActivityCache.push(doc.data()));
    }catch(e){
      console.error('Détail :', e.message);
      dashboardActivityError = true;
      dashboardActivityCache = null;
    }
    if(activeCat==='dashboard') renderDashboardView();
  }

  function renderDashboardView(){
    let totalValue=0, totalLowStock=0, totalDlcUrgent=0, totalProducts=0;
    CATEGORIES.forEach(c => {
      const produits = (state.data[c.id] && state.data[c.id].produits) || [];
      totalProducts += produits.length;
      produits.forEach(p => {
        totalValue += p.stock*p.prixAchat;
        if(p.seuilAlerte>0 && p.stock<=p.seuilAlerte) totalLowStock++;
        if(c.id==='nourriture'){
          (p.dlcLots||[]).forEach(l => { if(joursRestantsDLC(l.date)<=10) totalDlcUrgent++; });
        }
      });
    });

    const nomAffiche = (currentProfile && currentProfile.nom) ? currentProfile.nom : (currentUser?currentUser.email.replace(AUTH_EMAIL_DOMAIN,''):'');

    let html = `
      <div class="page-title-row">
        <h2 class="page-title">Bonjour${nomAffiche?', '+escapeHtml(nomAffiche):''} 👋</h2>
      </div>
      <div class="stats-row">
        <div class="stat-card"><b>${money(totalValue)}</b><small>Valeur totale du stock</small></div>
        <div class="stat-card" style="${totalLowStock>0?'border-color:var(--red);':''}"><b style="${totalLowStock>0?'color:var(--red);':''}">${totalLowStock}</b><small>Alertes stock bas</small></div>
        <div class="stat-card" style="${totalDlcUrgent>0?'border-color:var(--orange);':''}"><b style="${totalDlcUrgent>0?'color:var(--orange-dark);':''}">${totalDlcUrgent}</b><small>DLC ≤ 10 jours</small></div>
        <div class="stat-card"><b>${totalProducts}</b><small>Produits suivis</small></div>
      </div>
      <div class="dash-actions">
        <div class="dash-action-card" style="border-color:var(--orange); background:linear-gradient(135deg, #FFF4E9, #fff);" onclick="startPrestationFlow()">
          <span class="dash-action-emoji">🏁</span><b>Fin de prestation</b><small>Inventaire Boissons → Nourriture → Consommables, un seul rapport</small>
        </div>
        <div class="dash-action-card" onclick="setCat('boissons'); setTimeout(()=>setView('service'),30);">
          <span class="dash-action-emoji">🍺</span><b>Lancer un service</b><small>Comptage live des bières au fût</small>
        </div>
        <div class="dash-action-card" onclick="setCat('boissons')">
          <span class="dash-action-emoji">🥤</span><b>Boissons</b><small>${((state.data.boissons&&state.data.boissons.produits)||[]).length} produits</small>
        </div>
        <div class="dash-action-card" onclick="setCat('nourriture')">
          <span class="dash-action-emoji">🍽️</span><b>Nourriture</b><small>${((state.data.nourriture&&state.data.nourriture.produits)||[]).length} produits</small>
        </div>
        <div class="dash-action-card" onclick="setCat('consommables')">
          <span class="dash-action-emoji">🧴</span><b>Consommables</b><small>${((state.data.consommables&&state.data.consommables.produits)||[]).length} produits</small>
        </div>
      </div>
      <h3 class="dash-subtitle">📊 Statistiques</h3>
      <div id="dash-charts">${renderDashboardChartsHTML()}</div>
      <h3 class="dash-subtitle">Activité récente</h3>
      <div id="dash-activity">`;

    if(dashboardActivityError){
      html += `<div class="empty-state" style="padding:20px;">
        <b>⚠️ Impossible de charger l'activité</b>
        <div style="margin-top:10px;"><button class="btn-secondary" onclick="loadDashboardActivity()">🔄 Réessayer</button></div>
      </div>`;
    } else if(dashboardActivityCache === null){
      html += `<div class="empty-state" style="padding:20px;"><b>Chargement…</b></div>`;
    } else if(dashboardActivityCache.length === 0){
      html += `<div class="empty-state" style="padding:20px;"><b>Aucune activité pour l'instant</b>Les inventaires validés apparaîtront ici.</div>`;
    } else {
      const catEmoji = { boissons:'🥤', nourriture:'🍽️', consommables:'🧴' };
      dashboardActivityCache.forEach(e => {
        const dateStr = new Date(e.date).toLocaleString('fr-FR');
        html += `<div class="activity-row">
          <span class="activity-emoji">${catEmoji[e.catId]||'📦'}</span>
          <div class="activity-info">
            <b>${e.prestation ? escapeHtml(e.prestation) : (CATEGORIES.find(c=>c.id===e.catId)||{label:''}).label}</b>
            <small>${dateStr} — réalisé par ${escapeHtml(e.auteur)}</small>
          </div>
          <span class="activity-cost">${money(e.totalCout)}</span>
          <button class="icon-btn" title="Supprimer" onclick="deleteFromActivity('${e.catId}','${e.id}')">🗑</button>
        </div>`;
      });
    }
    html += `</div>`;
    document.getElementById('panel').innerHTML = html;
    if(dashboardActivityCache === null && !dashboardActivityError) loadDashboardActivity();
    setTimeout(()=>animateStatCards(),20);
  }

  function renderBilanView(){
    if(bilanError){
      document.getElementById('panel').innerHTML = `<div class="empty-state">
        <b>⚠️ Impossible de charger le bilan</b>
        Vérifie ta connexion internet.
        <div style="margin-top:14px;"><button class="btn-primary" onclick="loadBilanData()">🔄 Réessayer</button></div>
      </div>`;
      return;
    }
    if(bilanCache === null){
      document.getElementById('panel').innerHTML = `<div class="empty-state"><b>Chargement du bilan…</b></div>`;
      loadBilanData();
      return;
    }
    const groups = {};
    bilanCache.forEach(e => {
      const c = e.catId;
      const key = (e.prestation && e.prestation.trim()) ? e.prestation.trim() : '(Sans nom de prestation)';
      if(!groups[key]) groups[key] = { prestation:key, dates:[], parCat:{}, total:0 };
      groups[key].dates.push(e.date);
      groups[key].parCat[c] = (groups[key].parCat[c]||0) + e.totalCout;
      groups[key].total += e.totalCout;
    });
    const liste = Object.values(groups).sort((a,b)=> Math.max(...b.dates.map(d=>new Date(d))) - Math.max(...a.dates.map(d=>new Date(d))));

    if(liste.length===0){
      document.getElementById('panel').innerHTML = `<div class="empty-state"><b>Aucune prestation enregistrée</b>Dès que tu valideras un inventaire avec un nom de prestation, le coût total (toutes catégories confondues) apparaîtra ici.</div>`;
      return;
    }

    let html = `<p class="note" style="margin-top:0;">Coût matière total par prestation, toutes catégories confondues — pratique pour comparer avec ce que le client a payé et calculer ta marge.</p>
    <table><thead><tr>
      <th>Prestation</th><th>Dernière date</th>
      ${CATEGORIES.map(c=>`<th style="text-align:right">${c.label}</th>`).join('')}
      <th style="text-align:right">Total</th><th></th>
    </tr></thead><tbody>`;
    liste.forEach(g => {
      const derniereDate = new Date(Math.max(...g.dates.map(d=>new Date(d)))).toLocaleDateString('fr-FR');
      html += `<tr>
        <td data-label="Prestation">${escapeHtml(g.prestation)}</td>
        <td data-label="Dernière date">${derniereDate}</td>
        ${CATEGORIES.map(c=>`<td data-label="${c.label}" class="num">${g.parCat[c.id] ? money(g.parCat[c.id]) : '—'}</td>`).join('')}
        <td data-label="Total" class="num" style="font-weight:700; color:var(--orange-dark);">${money(g.total)}</td>
        <td style="text-align:right;"><button class="icon-btn" title="Supprimer cette prestation" onclick="deleteBilanGroup(${escapeHtml(JSON.stringify(g.prestation))})">🗑</button></td>
      </tr>`;
    });
    html += `</tbody></table>`;
    document.getElementById('panel').innerHTML = html;
  }

  const initBadge = document.getElementById('inv-badge-init');
  if(initBadge) initBadge.outerHTML = LOGO_IMG_TAG;
  const ORIGINAL_APP_HTML = document.getElementById('inv-root').innerHTML;

  const savedConfig = getSavedConfig();
  if(savedConfig){
    initFirebaseAndStart(savedConfig);
  } else {
    renderConfigScreen();
  }
})();
</script>

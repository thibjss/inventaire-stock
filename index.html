<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>

<style>
  :root{
    --bg:#FAF7F2;
    --ink:#1B2340;
    --ink-soft:#4A5170;
    --card:#FFFFFF;
    --orange:#FF6A3D;
    --orange-dark:#E14F22;
    --yellow:#FFC93C;
    --navy:#1B2A4A;
    --line:#EDE7DC;
    --red:#D64545;
    --green:#2FA36B;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  #inv-root{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    padding:28px;
  }
  .inv-header{
    display:flex; justify-content:space-between; align-items:flex-start;
    margin-bottom:20px; flex-wrap:wrap; gap:14px;
  }
  .inv-brand{ display:flex; align-items:center; gap:10px; }
  .inv-badge{
    width:42px; height:42px; border-radius:12px;
    background:linear-gradient(135deg, var(--orange), var(--yellow));
    display:flex; align-items:center; justify-content:center;
    font-family:'Poppins',sans-serif; font-weight:800; color:#fff; font-size:17px;
    box-shadow:0 4px 14px rgba(255,106,61,0.35);
  }
  .inv-title{
    font-family:'Poppins',sans-serif; font-weight:800; font-size:24px;
    color:var(--navy); margin:0; letter-spacing:-0.3px;
  }
  .inv-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .settings-box{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:10px 14px; font-size:12px; color:var(--ink-soft);
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    box-shadow:0 2px 8px rgba(27,35,64,0.05);
  }
  .settings-box input{
    background:var(--bg); border:1px solid var(--line); color:var(--ink);
    border-radius:8px; padding:7px 10px; font-size:12px; width:200px;
  }
  .settings-box button{
    background:var(--navy); border:none; color:#fff;
    border-radius:8px; padding:7px 12px; cursor:pointer; font-size:11.5px; font-weight:600;
  }
  .settings-box button:hover{ background:var(--orange); }

  .cat-tabs{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .cat-tab{
    font-family:'Poppins',sans-serif; font-weight:600; font-size:13px;
    padding:10px 20px; border-radius:999px; cursor:pointer; color:var(--ink-soft);
    background:var(--card); border:1px solid var(--line);
    transition:all .15s ease;
  }
  .cat-tab.active{ background:var(--orange); color:#fff; border-color:var(--orange); box-shadow:0 4px 12px rgba(255,106,61,0.3); }

  .view-tabs{ display:flex; gap:18px; margin-bottom:16px; border-bottom:2px solid var(--line); }
  .view-tab{
    font-size:13px; font-weight:600; padding:8px 2px 12px 2px; cursor:pointer; color:var(--ink-soft);
    border-bottom:3px solid transparent; margin-bottom:-2px;
  }
  .view-tab.active{ color:var(--navy); border-bottom:3px solid var(--orange); }

  .panel{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; box-shadow:0 2px 10px rgba(27,35,64,0.04); }

  .stats-row{ display:flex; gap:14px; margin-bottom:18px; flex-wrap:wrap; }
  .stat-card{
    background:var(--bg); border:1px solid var(--line); border-radius:12px;
    padding:12px 18px; min-width:140px;
  }
  .stat-card b{ display:block; font-family:'Poppins',sans-serif; font-size:20px; color:var(--navy); }
  .stat-card small{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-soft); }

  .toolbar{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; justify-content:space-between; align-items:center; }
  .btn-primary{
    background:var(--orange); color:#fff; border:none; border-radius:10px;
    padding:11px 18px; font-weight:700; font-size:13px; cursor:pointer;
    font-family:'Poppins',sans-serif;
    box-shadow:0 4px 12px rgba(255,106,61,0.3);
  }
  .btn-primary:hover{ background:var(--orange-dark); }
  .btn-secondary{
    background:transparent; border:1px solid var(--line); color:var(--ink-soft);
    border-radius:10px; padding:10px 16px; cursor:pointer; font-size:13px;
  }
  .btn-danger{ color:var(--red); border-color:var(--red); }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.5px;
    color:var(--ink-soft); padding:8px; border-bottom:2px solid var(--line);
  }
  td{ padding:11px 8px; border-bottom:1px solid var(--line); }
  tr:last-child td{ border-bottom:none; }
  .num{ font-family:'IBM Plex Mono',monospace; text-align:right; }
  .prix-detail{ font-size:11px; color:var(--ink-soft); }
  .count-input{
    width:80px; background:var(--bg); border:1px solid var(--line); color:var(--ink);
    border-radius:8px; padding:6px 8px; font-family:'IBM Plex Mono',monospace; text-align:right;
  }
  .sorti-neg{ color:var(--red); }
  .icon-btn{
    background:var(--bg); border:1px solid var(--line); color:var(--ink-soft);
    border-radius:8px; width:28px; height:28px; cursor:pointer; font-size:12px; margin-left:4px;
  }
  .icon-btn:hover{ border-color:var(--orange); color:var(--orange); }

  .empty-state{ text-align:center; padding:44px 20px; color:var(--ink-soft); }
  .empty-state b{ display:block; color:var(--navy); font-size:15px; margin-bottom:6px; font-family:'Poppins',sans-serif; }

  .modal-bg{ position:fixed; inset:0; background:#1B234099; z-index:50; display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal{ background:#fff; border-radius:16px; padding:24px; width:100%; max-width:440px; box-shadow:0 20px 50px rgba(27,35,64,0.25); }
  .modal h2{ font-family:'Poppins',sans-serif; font-weight:700; font-size:17px; margin:0 0 16px 0; color:var(--navy); }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:11px; color:var(--ink-soft); margin-bottom:5px; font-weight:600; }
  .field input, .field select{ width:100%; background:var(--bg); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:9px 10px; font-size:13px; font-family:'Inter',sans-serif; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .field-hint{ font-size:11.5px; color:var(--orange-dark); font-weight:600; margin-top:5px; }
  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }
  .note{ font-size:12px; color:var(--ink-soft); line-height:1.5; }

  .histo-entry{ border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  .histo-entry-head{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-soft); margin-bottom:8px; flex-wrap:wrap; gap:6px; }
  .histo-entry-head b{ color:var(--navy); }
  .histo-total{ font-family:'Poppins',sans-serif; color:var(--orange-dark); font-weight:700; }

  .inv-toast{
    position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-20px);
    background:var(--navy); color:#fff; padding:12px 20px; border-radius:10px;
    font-size:13px; font-weight:600; z-index:100; box-shadow:0 8px 24px rgba(27,35,64,0.3);
    opacity:0; transition:all .25s ease; max-width:90%; text-align:center;
  }
  .inv-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .inv-toast.inv-toast-error{ background:var(--red); }

  @media(max-width:700px){
    table, thead, tbody, th, td, tr{ display:block; }
    thead{ display:none; }
    td{ display:flex; justify-content:space-between; border-bottom:none; padding:4px 8px; }
    td::before{ content:attr(data-label); color:var(--ink-soft); font-size:10.5px; text-transform:uppercase; }
    tr{ border-bottom:1px solid var(--line); padding:8px 0; }
  }
</style>

<div id="inv-root">
  <div class="inv-header">
    <div class="inv-brand">
      <div class="inv-badge">M</div>
      <div>
        <h1 class="inv-title">Manifeste</h1>
        <div class="inv-sub" id="inv-subtitle">Chargement…</div>
      </div>
    </div>
    <div class="settings-box">
      ✉️ Email de backup :
      <input type="email" id="backup-email" placeholder="ton-adresse@exemple.com" />
      <button onclick="saveEmail()">Enregistrer</button>
      <button onclick="doLogout()" title="Se déconnecter">👤 Déconnexion</button>
      <button onclick="resetFirebaseConfig()" title="Changer de base de données">⚙️</button>
    </div>
  </div>

  <div class="cat-tabs" id="cat-tabs"></div>
  <div class="view-tabs" id="view-tabs"></div>
  <div class="panel" id="panel"></div>
</div>

<div id="modal-container"></div>

<script>
(function(){
  const CATEGORIES = [
    {id:'boissons', label:'🥤 Boissons', unite:'canette'},
    {id:'nourriture', label:'🍽️ Nourriture', unite:'kg'},
    {id:'consommables', label:'🧴 Consommables', unite:'unité'}
  ];
  const CONDITIONNEMENTS = [
    {label:"À l'unité", unites:1},
    {label:"Carton de 6", unites:6},
    {label:"Carton de 12", unites:12},
    {label:"Fardo de 24", unites:24},
    {label:"Fût / vrac (calcul par volume)", unites:null, volumique:true},
    {label:"Lot personnalisé", unites:null}
  ];

  let state = { emailBackup:'', data:{} };
  CATEGORIES.forEach(c => state.data[c.id] = { produits: [], historique: [] });
  let activeCat = 'boissons';
  let activeView = 'stock';
  let comptages = {};
  let loaded = false;
  let db = null;
  const DOC_PATH = ['manifeste', 'inventaire-data'];

  function getSavedConfig(){
    try{ return JSON.parse(localStorage.getItem('inv-firebase-config') || 'null'); }
    catch(e){ return null; }
  }

  function initFirebaseAndStart(config){
    try{
      if(!firebase.apps || firebase.apps.length === 0){
        firebase.initializeApp(config);
      }
      db = firebase.firestore();
      firebase.auth().onAuthStateChanged(function(user){
        if(user){
          currentUser = user;
          document.getElementById('inv-root').innerHTML = ORIGINAL_APP_HTML;
          loadData();
        } else if(db !== null) {
          currentUser = null;
          renderLoginScreen();
        }
      });
    }catch(e){
      console.error(e);
      renderConfigScreen("La configuration semble invalide (" + e.message + "). Vérifie que tu as bien copié tout l'objet JSON depuis Firebase.");
    }
  }

  const AUTH_EMAIL_DOMAIN = '@manifeste-app.local';
  let currentUser = null;

  function renderLoginScreen(errorMsg){
    document.getElementById('inv-root').innerHTML = `
      <div style="max-width:400px; margin:60px auto;">
        <div class="inv-brand" style="margin-bottom:18px; justify-content:center;">
          <div class="inv-badge">M</div>
          <div><h1 class="inv-title">Manifeste</h1><div class="inv-sub">Connexion</div></div>
        </div>
        <div class="panel">
          <div class="field"><label>Pseudo</label><input type="text" id="login-pseudo" placeholder="ex. thibaut" /></div>
          <div class="field"><label>Mot de passe</label><input type="password" id="login-password" /></div>
          ${errorMsg ? `<p class="note" style="color:var(--red); font-weight:600;">${escapeHtml(errorMsg)}</p>` : ''}
          <div class="modal-actions" style="justify-content:flex-start;">
            <button class="btn-primary" onclick="doLogin()">Se connecter</button>
          </div>
          <p class="note" style="margin-top:16px; cursor:pointer; text-decoration:underline;" onclick="resetFirebaseConfig()">Changer de base de données</p>
        </div>
      </div>`;
    document.getElementById('login-password').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
  }

  window.doLogin = function(){
    const pseudo = document.getElementById('login-pseudo').value.trim().toLowerCase();
    const password = document.getElementById('login-password').value;
    if(!pseudo || !password){ renderLoginScreen("Renseigne un pseudo et un mot de passe."); return; }
    firebase.auth().signInWithEmailAndPassword(pseudo + AUTH_EMAIL_DOMAIN, password)
      .catch(function(err){
        const messages = {
          'auth/user-not-found': `Aucun compte pour le pseudo "${pseudo}". Vérifie l'orthographe, ou crée ce compte dans Firebase (Authentication → Users → Add user, email : ${pseudo}${AUTH_EMAIL_DOMAIN}).`,
          'auth/wrong-password': "Mot de passe incorrect pour ce pseudo.",
          'auth/invalid-credential': "Pseudo ou mot de passe incorrect.",
          'auth/invalid-email': "Ce pseudo contient des caractères non autorisés.",
          'auth/operation-not-allowed': "La connexion par mot de passe n'est pas activée sur ce projet Firebase. Dans la console : Authentication → Sign-in method → active Email/Password.",
          'auth/too-many-requests': "Trop de tentatives, réessaie dans quelques minutes.",
          'auth/network-request-failed': "Problème de connexion internet.",
        };
        renderLoginScreen((messages[err.code] || (err.code + ' — ' + err.message)));
      });
  }

  window.doLogout = function(){
    showConfirm("Se déconnecter ?", function(){ firebase.auth().signOut(); });
  }

  function renderConfigScreen(errorMsg){
    document.getElementById('inv-root').innerHTML = `
      <div style="max-width:560px; margin:40px auto;">
        <div class="inv-brand" style="margin-bottom:18px;">
          <div class="inv-badge">M</div>
          <div><h1 class="inv-title">Manifeste</h1><div class="inv-sub">Configuration du stockage partagé</div></div>
        </div>
        <div class="panel">
          <p class="note" style="margin-top:0;">Pour que tout ton équipe travaille sur le même inventaire (achats, stock, historique), le site a besoin d'une base de données Firebase gratuite.</p>
          <ol class="note" style="padding-left:18px;">
            <li>Va sur <b>console.firebase.google.com</b>, connecte-toi avec un compte Google et crée un projet (gratuit)</li>
            <li>Dans le projet : <b>Build → Firestore Database → Create database</b> (mode production ou test)</li>
            <li>Dans <b>Project settings → General → Your apps</b>, clique sur l'icône Web ( &lt;/&gt; ) pour créer une "web app", donne-lui un nom</li>
            <li>Copie l'objet <b>firebaseConfig</b> affiché (celui qui commence par <code>{ apiKey: ...}</code>) et colle-le ci-dessous</li>
          </ol>
          ${errorMsg ? `<p class="note" style="color:var(--red); font-weight:600;">${escapeHtml(errorMsg)}</p>` : ''}
          <div class="field">
            <label>Configuration Firebase (coller l'objet complet)</label>
            <textarea id="config-input" rows="8" style="width:100%; font-family:'IBM Plex Mono',monospace; font-size:12px; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px;" placeholder='{
  apiKey: "...",
  authDomain: "...",
  projectId: "...",
  ...
}'></textarea>
          </div>
          <div class="modal-actions" style="justify-content:flex-start;">
            <button class="btn-primary" onclick="saveFirebaseConfig()">Connecter</button>
          </div>
          <p class="note">Cette configuration est enregistrée sur cet appareil/navigateur uniquement — répète l'opération (copier-coller la même config) sur chaque appareil ou pour chaque membre de l'équipe. Les données d'inventaire, elles, seront bien partagées entre tout le monde.</p>
        </div>
      </div>`;
  }

  window.saveFirebaseConfig = function(){
    const raw = document.getElementById('config-input').value.trim();
    let cfg;
    try{
      // autorise le collage tel quel depuis Firebase (clés non citées) en le rendant JSON-valide
      const jsonish = raw.replace(/([{,]\s*)([a-zA-Z0-9_]+)(\s*:)/g, '$1"$2"$3').replace(/'/g,'"');
      cfg = JSON.parse(jsonish);
    }catch(e){
      renderConfigScreen("Format non reconnu — vérifie que tu as bien copié tout l'objet, accolades comprises.");
      return;
    }
    localStorage.setItem('inv-firebase-config', JSON.stringify(cfg));
    initFirebaseAndStart(cfg);
  }

  window.resetFirebaseConfig = function(){
    showConfirm("Déconnecter cet appareil de la base de données partagée ?", function(){
      try{ firebase.auth().signOut(); }catch(e){}
      localStorage.removeItem('inv-firebase-config');
      db = null;
      renderConfigScreen();
    });
  }

  async function loadData(){
    try{
      const doc = await db.collection(DOC_PATH[0]).doc(DOC_PATH[1]).get();
      if(doc.exists){
        const parsed = doc.data();
        state.emailBackup = parsed.emailBackup || '';
        CATEGORIES.forEach(c => { if(parsed.data && parsed.data[c.id]) state.data[c.id] = parsed.data[c.id]; });
      }
    }catch(e){
      console.error(e);
      showToast("Impossible de charger les données partagées. Vérifie ta connexion et la configuration Firebase.", true);
    }
    loaded = true;
    document.getElementById('backup-email').value = state.emailBackup;
    render();
  }

  async function saveData(){
    try{
      await db.collection(DOC_PATH[0]).doc(DOC_PATH[1]).set(JSON.parse(JSON.stringify(state)));
    }catch(e){
      console.error(e);
      showToast("Erreur de sauvegarde — vérifie ta connexion internet.", true);
    }
  }

  window.saveEmail = function(){
    state.emailBackup = document.getElementById('backup-email').value.trim();
    saveData();
  }

  function uid(){ return 'p_' + Math.random().toString(36).slice(2,10); }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function money(n){ return Number(n||0).toFixed(2).replace('.',',') + ' €'; }

  window.showToast = function(msg, isError){
    const el = document.createElement('div');
    el.className = 'inv-toast' + (isError?' inv-toast-error':'');
    el.textContent = msg;
    document.body.appendChild(el);
    requestAnimationFrame(()=> el.classList.add('show'));
    setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),300); }, 3200);
  }

  let pendingConfirmAction = null;
  window.showConfirm = function(message, action){
    pendingConfirmAction = action;
    document.getElementById('modal-container').innerHTML = `
      <div class="modal-bg" onclick="if(event.target===this) cancelConfirm()">
        <div class="modal">
          <h2>Confirmation</h2>
          <p class="note">${escapeHtml(message)}</p>
          <div class="modal-actions">
            <button class="btn-secondary" onclick="cancelConfirm()">Annuler</button>
            <button class="btn-primary" onclick="runConfirm()">Confirmer</button>
          </div>
        </div>
      </div>`;
  }
  window.cancelConfirm = function(){ pendingConfirmAction = null; closeModal(); }
  window.runConfirm = function(){
    const action = pendingConfirmAction;
    pendingConfirmAction = null;
    closeModal();
    if(action) action();
  }

  function renderCatTabs(){
    document.getElementById('cat-tabs').innerHTML = CATEGORIES.map(c =>
      `<div class="cat-tab ${activeCat===c.id?'active':''}" onclick="setCat('${c.id}')">${c.label}</div>`
    ).join('');
  }
  window.setCat = function(id){ activeCat = id; activeView='stock'; comptages={}; render(); }

  function renderViewTabs(){
    const views = [['stock','Mon stock'],['inventaire','Inventaire'],['historique','Historique']];
    document.getElementById('view-tabs').innerHTML = views.map(([id,label]) =>
      `<div class="view-tab ${activeView===id?'active':''}" onclick="setView('${id}')">${label}</div>`
    ).join('');
  }
  window.setView = function(id){ activeView = id; comptages={}; render(); }

  function catData(){ return state.data[activeCat]; }
  function catInfo(){ return CATEGORIES.find(c => c.id===activeCat); }

  // ---------- VUE : MON STOCK ----------
  function renderStockView(){
    const produits = catData().produits.slice().sort((a,b)=>a.nom.localeCompare(b.nom));
    const valeurStock = produits.reduce((s,p)=>s+p.stock*p.prixAchat,0);

    let html = `<div class="stats-row">
      <div class="stat-card"><b>${produits.length}</b><small>Produits</small></div>
      <div class="stat-card"><b>${money(valeurStock)}</b><small>Valeur du stock</small></div>
    </div>
    <div class="toolbar">
      <div></div>
      <button class="btn-primary" onclick="openProductModal(null)">+ Ajouter un produit</button>
    </div>`;

    if(produits.length===0){
      html += `<div class="empty-state"><b>Aucun produit enregistré</b>Ajoute les produits que tu achètes et stockes pour cette catégorie.</div>`;
    } else {
      html += `<table><thead><tr>
        <th>Produit</th><th style="text-align:right">Prix</th><th style="text-align:right">Stock</th><th style="text-align:right">Valeur</th><th></th>
      </tr></thead><tbody>`;
      produits.forEach(p => {
        html += `<tr>
          <td data-label="Produit">${escapeHtml(p.nom)}</td>
          <td data-label="Prix" class="num">${money(p.prixAchat)} / ${escapeHtml(p.unite)}<div class="prix-detail">${escapeHtml(p.conditionnement)} — ${money(p.prixLot)}</div></td>
          <td data-label="Stock" class="num">${p.stock} ${escapeHtml(p.unite)}(s)</td>
          <td data-label="Valeur" class="num">${money(p.stock*p.prixAchat)}</td>
          <td style="text-align:right; white-space:nowrap;">
            <button class="icon-btn" title="Réapprovisionner" onclick="openRestockModal('${p.id}')">↻</button>
            <button class="icon-btn" title="Modifier" onclick="openProductModal('${p.id}')">✎</button>
            <button class="icon-btn" title="Supprimer" onclick="deleteProduct('${p.id}')">🗑</button>
          </td>
        </tr>`;
      });
      html += `</tbody></table>`;
    }
    document.getElementById('panel').innerHTML = html;
  }

  window.deleteProduct = function(id){
    const p = catData().produits.find(x=>x.id===id);
    showConfirm(`Supprimer "${p?p.nom:'ce produit'}" du stock ? Cette action est irréversible.`, function(){
      catData().produits = catData().produits.filter(x => x.id !== id);
      saveData();
      render();
      showToast('Produit supprimé.');
    });
  }

  function condOptions(selected){
    return CONDITIONNEMENTS.map(c => `<option value="${c.label}" ${selected===c.label?'selected':''}>${c.label}</option>`).join('');
  }

  window.openProductModal = function(id){
    const editing = id ? catData().produits.find(p=>p.id===id) : null;
    const defaultCond = editing ? editing.conditionnement : "À l'unité";
    document.getElementById('modal-container').innerHTML = `
      <div class="modal-bg" onclick="if(event.target===this) closeModal()">
        <div class="modal">
          <h2>${editing?'Modifier le produit':'Nouveau produit'}</h2>
          <div class="field"><label>Nom</label><input type="text" id="f-nom" value="${editing?escapeHtml(editing.nom):''}" placeholder="Ex. Coca-Cola 33cl" /></div>
          <div class="field"><label>Unité de comptage (utilisée pour l'inventaire)</label><input type="text" id="f-unite" value="${editing?escapeHtml(editing.unite):catInfo().unite}" placeholder="Ex. canette, bouteille, kg" /></div>
          <div class="field">
            <label>J'achète par</label>
            <select id="f-cond" onchange="updateCondDefault()">${condOptions(defaultCond)}</select>
          </div>
          <div id="f-lot-fields"></div>
          <div class="field">
            <label>Prix payé pour ce lot</label>
            <input type="number" step="0.01" min="0" id="f-prix-lot" value="${editing?editing.prixLot:''}" oninput="updatePrixCalc()" />
          </div>
          <div class="field-hint" id="prix-calc-hint"></div>
          <div class="field"><label>Stock actuel (en ${editing?escapeHtml(editing.unite):catInfo().unite}s)</label><input type="number" step="0.01" min="0" id="f-stock" value="${editing?editing.stock:0}" /></div>
          <div class="modal-actions">
            <button class="btn-secondary" onclick="closeModal()">Annuler</button>
            <button class="btn-primary" onclick="saveProduct('${editing?editing.id:''}')">${editing?'Enregistrer':'Ajouter'}</button>
          </div>
        </div>
      </div>`;
    renderLotFields('f', editing);
  }

  function renderLotFields(prefix, editing){
    const sel = document.getElementById(prefix+'-cond').value;
    const cond = CONDITIONNEMENTS.find(c => c.label===sel);
    const container = document.getElementById(prefix+'-lot-fields');
    if(cond && cond.volumique){
      const volumeL = editing && editing.volumeL ? editing.volumeL : '';
      const portionCl = editing && editing.portionCl ? editing.portionCl : 25;
      container.innerHTML = `
        <div class="field-row">
          <div class="field"><label>Volume du contenant (litres)</label><input type="number" step="0.01" min="0" id="${prefix}-volume-l" value="${volumeL}" oninput="updateVolumeCalc('${prefix}')" placeholder="Ex. 30" /></div>
          <div class="field"><label>Taille de la portion servie (cl)</label><input type="number" step="0.01" min="0" id="${prefix}-portion-cl" value="${portionCl}" oninput="updateVolumeCalc('${prefix}')" placeholder="Ex. 25" /></div>
        </div>
        <input type="hidden" id="${prefix}-unites-lot" value="${editing?editing.unitesParLot:0}" />
      `;
      updateVolumeCalc(prefix);
    } else {
      const unitesVal = (cond && cond.unites !== null) ? cond.unites : (editing?editing.unitesParLot:1);
      container.innerHTML = `
        <div class="field"><label>Unités par lot</label><input type="number" min="1" id="${prefix}-unites-lot" value="${unitesVal}" oninput="updatePrixCalc()" /></div>
      `;
      updatePrixCalc();
    }
  }

  window.updateVolumeCalc = function(prefix){
    const volumeL = Number(document.getElementById(prefix+'-volume-l').value)||0;
    const portionCl = Number(document.getElementById(prefix+'-portion-cl').value)||0;
    const unitesInput = document.getElementById(prefix+'-unites-lot');
    const unites = portionCl > 0 ? (volumeL*100)/portionCl : 0;
    unitesInput.value = Math.round(unites*10)/10;
    if(prefix === 'f') updatePrixCalc();
  }

  window.updateCondDefault = function(){
    renderLotFields('f', null);
  }

  window.updatePrixCalc = function(){
    const unitesEl = document.getElementById('f-unites-lot');
    const unites = unitesEl ? Number(unitesEl.value)||0 : 0;
    const prixLot = Number(document.getElementById('f-prix-lot').value)||0;
    const hint = document.getElementById('prix-calc-hint');
    if(unites > 0 && prixLot > 0){
      hint.textContent = `= ${money(prixLot/unites)} par unité`;
    } else {
      hint.textContent = '';
    }
  }

  window.saveProduct = function(id){
    const nom = document.getElementById('f-nom').value.trim();
    if(!nom){ showToast("Le nom du produit est requis.", true); return; }
    const cond = CONDITIONNEMENTS.find(c => c.label===document.getElementById('f-cond').value);
    const unitesParLot = Number(document.getElementById('f-unites-lot').value)||1;
    const prixLot = Number(document.getElementById('f-prix-lot').value)||0;
    const data = {
      nom,
      unite: document.getElementById('f-unite').value.trim() || 'unité',
      conditionnement: document.getElementById('f-cond').value,
      unitesParLot,
      prixLot,
      prixAchat: unitesParLot > 0 ? prixLot/unitesParLot : 0,
      stock: Number(document.getElementById('f-stock').value)||0,
    };
    if(cond && cond.volumique){
      data.volumeL = Number(document.getElementById('f-volume-l').value)||0;
      data.portionCl = Number(document.getElementById('f-portion-cl').value)||0;
    } else {
      data.volumeL = undefined;
      data.portionCl = undefined;
    }
    if(id){
      const idx = catData().produits.findIndex(p=>p.id===id);
      catData().produits[idx] = {...catData().produits[idx], ...data};
    } else {
      catData().produits.push({id:uid(), ...data});
    }
    saveData(); closeModal(); render();
  }

  window.openRestockModal = function(id){
    const p = catData().produits.find(x=>x.id===id);
    document.getElementById('modal-container').innerHTML = `
      <div class="modal-bg" onclick="if(event.target===this) closeModal()">
        <div class="modal">
          <h2>Réapprovisionner — ${escapeHtml(p.nom)}</h2>
          <div class="field">
            <label>J'achète par</label>
            <select id="r-cond" onchange="renderRestockLotFields('${id}')">${condOptions(p.conditionnement)}</select>
          </div>
          <div id="r-lot-fields"></div>
          <div class="field-row">
            <div class="field"><label>Nombre de lots achetés</label><input type="number" step="1" min="0" id="r-nb-lots" value="1" oninput="updateRestockCalc('${id}')" /></div>
            <div class="field"><label>Prix payé par lot</label><input type="number" step="0.01" min="0" id="r-prix-lot" value="${p.prixLot}" oninput="updateRestockCalc('${id}')" /></div>
          </div>
          <div class="field-hint" id="restock-calc-hint"></div>
          <div class="modal-actions">
            <button class="btn-secondary" onclick="closeModal()">Annuler</button>
            <button class="btn-primary" onclick="confirmRestock('${id}')">Ajouter au stock</button>
          </div>
        </div>
      </div>`;
    renderRestockLotFields(id);
  }

  window.renderRestockLotFields = function(id){
    const p = catData().produits.find(x=>x.id===id);
    const sel = document.getElementById('r-cond').value;
    const cond = CONDITIONNEMENTS.find(c => c.label===sel);
    const container = document.getElementById('r-lot-fields');
    if(cond && cond.volumique){
      const volumeL = p.volumeL || '';
      const portionCl = p.portionCl || 25;
      container.innerHTML = `
        <div class="field-row">
          <div class="field"><label>Volume du contenant (litres)</label><input type="number" step="0.01" min="0" id="r-volume-l" value="${volumeL}" oninput="updateRestockVolumeCalc('${id}')" placeholder="Ex. 30" /></div>
          <div class="field"><label>Taille de la portion servie (cl)</label><input type="number" step="0.01" min="0" id="r-portion-cl" value="${portionCl}" oninput="updateRestockVolumeCalc('${id}')" placeholder="Ex. 25" /></div>
        </div>
        <input type="hidden" id="r-unites-lot" value="${p.unitesParLot}" />
      `;
      updateRestockVolumeCalc(id);
    } else {
      const unitesVal = (cond && cond.unites !== null) ? cond.unites : p.unitesParLot;
      container.innerHTML = `<div class="field"><label>Unités par lot</label><input type="number" min="1" id="r-unites-lot" value="${unitesVal}" oninput="updateRestockCalc('${id}')" /></div>`;
      updateRestockCalc(id);
    }
  }

  window.updateRestockVolumeCalc = function(id){
    const volumeL = Number(document.getElementById('r-volume-l').value)||0;
    const portionCl = Number(document.getElementById('r-portion-cl').value)||0;
    const unites = portionCl > 0 ? (volumeL*100)/portionCl : 0;
    document.getElementById('r-unites-lot').value = Math.round(unites*10)/10;
    updateRestockCalc(id);
  }

  window.updateRestockCalc = function(id){
    const p = catData().produits.find(x=>x.id===id);
    const unites = Number(document.getElementById('r-unites-lot').value)||0;
    const nbLots = Number(document.getElementById('r-nb-lots').value)||0;
    const prixLot = Number(document.getElementById('r-prix-lot').value)||0;
    const totalUnites = unites*nbLots;
    const hint = document.getElementById('restock-calc-hint');
    if(unites>0 && prixLot>0){
      hint.textContent = `= ${totalUnites} ${p.unite}(s) ajoutée(s), à ${money(prixLot/unites)} par ${p.unite}`;
    } else {
      hint.textContent = '';
    }
  }

  window.confirmRestock = function(id){
    const p = catData().produits.find(x=>x.id===id);
    const cond = CONDITIONNEMENTS.find(c => c.label===document.getElementById('r-cond').value);
    const unitesParLot = Number(document.getElementById('r-unites-lot').value)||1;
    const nbLots = Number(document.getElementById('r-nb-lots').value)||0;
    const prixLot = Number(document.getElementById('r-prix-lot').value)||0;
    const conditionnement = document.getElementById('r-cond').value;
    p.stock += unitesParLot*nbLots;
    if(prixLot > 0){
      p.conditionnement = conditionnement;
      p.unitesParLot = unitesParLot;
      p.prixLot = prixLot;
      p.prixAchat = unitesParLot > 0 ? prixLot/unitesParLot : p.prixAchat;
      if(cond && cond.volumique){
        p.volumeL = Number(document.getElementById('r-volume-l').value)||0;
        p.portionCl = Number(document.getElementById('r-portion-cl').value)||0;
      }
    }
    saveData(); closeModal(); render();
  }

  // ---------- VUE : INVENTAIRE ----------
  function renderInventaireView(){
    const produits = catData().produits.slice().sort((a,b)=>a.nom.localeCompare(b.nom));
    if(produits.length===0){
      document.getElementById('panel').innerHTML = `<div class="empty-state"><b>Aucun produit à inventorier</b>Ajoute d'abord des produits dans l'onglet "Mon stock".</div>`;
      return;
    }
    let totalSortiCout = 0;
    let html = `<p class="note" style="margin-top:0;">Indique la quantité restante comptée pour chaque produit après la prestation. La quantité sortie et son coût seront calculés automatiquement.</p>
    <table><thead><tr>
      <th>Produit</th><th style="text-align:right">Stock avant</th><th style="text-align:right">Compté maintenant</th><th style="text-align:right">Sorti</th><th style="text-align:right">Coût sorti</th>
    </tr></thead><tbody>`;
    produits.forEach(p => {
      const compte = comptages.hasOwnProperty(p.id) ? comptages[p.id] : p.stock;
      const sorti = p.stock - compte;
      const cout = sorti * p.prixAchat;
      totalSortiCout += cout;
      html += `<tr>
        <td data-label="Produit">${escapeHtml(p.nom)} <span style="color:var(--ink-soft); font-size:11px;">(${escapeHtml(p.unite)})</span></td>
        <td data-label="Stock avant" class="num">${p.stock}</td>
        <td data-label="Compté maintenant"><input type="number" step="0.01" class="count-input" value="${compte}" onchange="updateComptage('${p.id}', this.value)" /></td>
        <td data-label="Sorti" class="num ${sorti<0?'sorti-neg':''}">${sorti}</td>
        <td data-label="Coût sorti" class="num">${money(cout)}</td>
      </tr>`;
    });
    html += `</tbody></table>
    <div class="stats-row" style="margin-top:16px;">
      <div class="stat-card"><b>${money(totalSortiCout)}</b><small>Coût total sorti (pour calcul de marge)</small></div>
    </div>
    <div class="toolbar">
      <div></div>
      <button class="btn-primary" onclick="openValidateModal()">Valider l'inventaire</button>
    </div>`;
    document.getElementById('panel').innerHTML = html;
  }

  window.updateComptage = function(id, val){ comptages[id] = Number(val)||0; }

  window.openValidateModal = function(){
    document.getElementById('modal-container').innerHTML = `
      <div class="modal-bg" onclick="if(event.target===this) closeModal()">
        <div class="modal">
          <h2>Confirmer l'inventaire</h2>
          <p class="note">Cet inventaire va mettre à jour le stock, être enregistré dans l'historique, et un email de backup s'ouvrira dans ta messagerie.</p>
          <div class="field"><label>Qui réalise cet inventaire ?</label><input type="text" id="f-auteur" value="${currentUser ? escapeHtml(currentUser.email.replace(AUTH_EMAIL_DOMAIN,'')) : ''}" placeholder="Prénom Nom" /></div>
          <div class="modal-actions">
            <button class="btn-secondary" onclick="closeModal()">Annuler</button>
            <button class="btn-primary" onclick="validerInventaire()">Confirmer</button>
          </div>
        </div>
      </div>`;
  }

  window.validerInventaire = function(){
    const auteur = document.getElementById('f-auteur').value.trim();
    if(!auteur){ showToast("Merci d'indiquer qui réalise l'inventaire.", true); return; }

    const produits = catData().produits;
    const lignes = [];
    let totalCout = 0;
    produits.forEach(p => {
      const compte = comptages.hasOwnProperty(p.id) ? comptages[p.id] : p.stock;
      const sorti = p.stock - compte;
      const cout = sorti * p.prixAchat;
      totalCout += cout;
      lignes.push({ nom:p.nom, unite:p.unite, stockAvant:p.stock, compte, sorti, cout });
      p.stock = compte;
    });

    const entry = { id: uid(), date: new Date().toISOString(), auteur, lignes, totalCout };
    catData().historique.unshift(entry);
    saveData();
    closeModal();
    envoyerEmail(entry);
    comptages = {};
    render();
  }

  function envoyerEmail(entry){
    const cat = catInfo();
    const dateStr = new Date(entry.date).toLocaleString('fr-FR');
    let body = `Inventaire ${cat.label} — ${dateStr}\nRéalisé par : ${entry.auteur}\n\n`;
    entry.lignes.forEach(l => {
      body += `${l.nom} (${l.unite}) : avant ${l.stockAvant} -> compté ${l.compte} | sorti ${l.sorti} | coût ${money(l.cout)}\n`;
    });
    body += `\nCOÛT TOTAL SORTI : ${money(entry.totalCout)}`;
    const subject = `Inventaire ${cat.label} - ${dateStr}`;
    const mailto = `mailto:${encodeURIComponent(state.emailBackup)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    if(!state.emailBackup){
      showToast("Aucune adresse email de backup enregistrée pour l'instant.", true);
    }
    window.location.href = mailto;
  }

  // ---------- VUE : HISTORIQUE ----------
  function renderHistoriqueView(){
    const histo = catData().historique;
    if(histo.length===0){
      document.getElementById('panel').innerHTML = `<div class="empty-state"><b>Aucun inventaire enregistré</b>Les inventaires validés apparaîtront ici.</div>`;
      return;
    }
    let html = '';
    histo.forEach(e => {
      const dateStr = new Date(e.date).toLocaleString('fr-FR');
      html += `<div class="histo-entry">
        <div class="histo-entry-head"><span><b>${dateStr}</b> — réalisé par ${escapeHtml(e.auteur)}</span><span class="histo-total">${money(e.totalCout)} sortis</span></div>
        <table><thead><tr><th>Produit</th><th style="text-align:right">Avant</th><th style="text-align:right">Compté</th><th style="text-align:right">Sorti</th><th style="text-align:right">Coût</th></tr></thead><tbody>`;
      e.lignes.forEach(l => {
        html += `<tr><td data-label="Produit">${escapeHtml(l.nom)}</td><td data-label="Avant" class="num">${l.stockAvant}</td><td data-label="Compté" class="num">${l.compte}</td><td data-label="Sorti" class="num">${l.sorti}</td><td data-label="Coût" class="num">${money(l.cout)}</td></tr>`;
      });
      html += `</tbody></table></div>`;
    });
    document.getElementById('panel').innerHTML = html;
  }

  window.closeModal = function(){ document.getElementById('modal-container').innerHTML=''; }

  function render(){
    if(!loaded) return;
    document.getElementById('inv-subtitle').textContent = "Gestion de stock & inventaires de prestation";
    renderCatTabs();
    renderViewTabs();
    if(activeView==='stock') renderStockView();
    else if(activeView==='inventaire') renderInventaireView();
    else renderHistoriqueView();
  }

  const ORIGINAL_APP_HTML = document.getElementById('inv-root').innerHTML;

  const savedConfig = getSavedConfig();
  if(savedConfig){
    initFirebaseAndStart(savedConfig);
  } else {
    renderConfigScreen();
  }
})();
</script>
